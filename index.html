<body>
  <header class="masthead">
    <div class="brand">
      <h1>The Stacks</h1>
      <p>Every book you've finished, filed in the order you'd actually defend.</p>
    </div>
    <div style="text-align:right">
      <div class="count" id="count" aria-live="polite">0 volumes</div>
      <div class="top-actions">
        <button class="add-btn" id="addBtn">＋ Log a finished book</button>
        <button class="ghost-top" id="insightsBtn">Insights</button>
      </div>
      <!-- Only appears when the account library loaded and we're on a real web address.
           Opened as a local file, or offline, this stays hidden and nothing changes. -->
      <div class="account-bar" id="accountBar" hidden></div>
    </div>
  </header>

  <section class="controls" id="controls" hidden>
    <div class="controls-top">
      <input type="search" id="q" class="ctrl-search" placeholder="Search title or author…" aria-label="Search by title or author" autocomplete="off">
      <label class="ctrl-field"><span class="ctrl-lab">Sort</span>
        <select id="sortSel" aria-label="Sort books">
          <option value="score">By score</option>
          <option value="newest">Newest finished</option>
          <option value="oldest">Oldest finished</option>
          <option value="added">Recently added</option>
          <option value="title">Title A–Z</option>
          <option value="author">Author A–Z</option>
        </select>
      </label>
    </div>
    <div class="chips" id="tierChips" role="group" aria-label="Filter by tier and genre">
      <button type="button" class="chip" data-tier="loved">Loved it</button>
      <button type="button" class="chip" data-tier="fine">It was fine</button>
      <button type="button" class="chip" data-tier="disliked">Didn't like it</button>
      <span class="genre-filter" id="genreFilter" hidden>
        <button type="button" class="chip genre-chip" id="genreChip" aria-haspopup="true" aria-expanded="false">Genre</button>
        <div class="genre-pop" id="genrePop" role="menu" aria-label="Filter by genre" hidden></div>
      </span>
      <button type="button" class="chip needs-chip" id="needsChip" aria-pressed="false" hidden>Needs ranking</button>
    </div>
  </section>

  <main class="shelf" id="shelf"></main>

  <footer class="vault" aria-label="Backup and restore">
    <button class="vault-btn" id="exportBtn">Export catalog</button>
    <button class="vault-btn" id="importBtn">Import catalog</button>
    <button class="vault-btn" id="grBtn">Import from Goodreads</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <input type="file" id="grFile" accept=".csv,text/csv" hidden>
  </footer>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet" id="sheet"></div>
  </div>

<!-- Accounts: the Supabase client, pinned. A documented online exception like the fonts
     and the title lookup. Everything that uses it checks it actually loaded first. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";

  // ---- Config ----
  const KEY = "the-stacks-v3";       // current schema (books also carry addedOn)
  const KEY_V2 = "the-stacks-v2";    // genres[] + finishedOn
  const KEY_V1 = "the-stacks-v1";    // original; both older keys stay on disk as fallbacks
  const TIERS = ["loved","fine","disliked"];
  const TIER_META = {
    loved:    { label:"Loved it",      band:[7.0,10.0], sub:"couldn't stop thinking about it" },
    fine:     { label:"It was fine",   band:[4.0, 6.9], sub:"read it, no regrets, no fireworks" },
    disliked: { label:"Didn't like it",band:[1.0, 3.9], sub:"a slog, or just not for me" }
  };
  // Month name -> 0-based index (used by both the migration and the date sort).
  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  // "Jan".."Dec", derived from MONTHS so the two lists can never drift apart.
  const MONTH_NAMES = Object.keys(MONTHS).map(m => m[0].toUpperCase() + m.slice(1));
  // Suggested genres shown as chips; the reader's own genres get added to these on the fly.
  const STARTER_GENRES = ["Literary Fiction","Fantasy","Sci-Fi","Mystery & Thriller","Romance","Horror","Poetry","Historical","Nonfiction","Memoir","Science","Philosophy"];
  const MAX_GENRES = 3; // a book can carry at most this many genres
  const INSIGHTS_MIN = 10; // books needed before the Insights view shows patterns
  const GENRE_MIN = 3;     // books a genre needs before it appears in "rated highest"
  const UNTAGGED = "UNTAGGED"; // genre-filter option for books with no genres (uppercase → never a real gkey)

  // ---- State ----
  let store = load();
  let flow = null; // active add-flow or detail state
  // Transient search/sort/filter view. Never saved to storage; resets on reload.
  // A function (not a shared object) so each reset gets its own fresh genres[] array.
  function freshView(){ return { query:"", sort:"score", tier:"all", genres:[], needsRanking:false }; }
  let view = freshView();
  // Ids whose note the reader has expanded on the card face. Transient like `view`:
  // never written to storage, so notes are collapsed again after a reload.
  const expandedNotes = new Set();

  // `unranked` is the holding area: books you've read but haven't judged yet. They
  // are deliberately NOT a fourth tier — they have no score and no rank, because no
  // opinion has been given. Filing one moves it out of here and into a real tier.
  function emptyStore(){ return { books:{}, rankings:{loved:[],fine:[],disliked:[]}, unranked:[] }; }
  function isValidShape(s){ return s && s.books && s.rankings; }

  // Derive a sortable "YYYY-MM-DD" from an old display date like "Jul 2026".
  // Best-effort at month precision (day defaults to 01); returns "" if unparseable.
  function isoFromDisplay(s){
    const m = (s||"").trim().toLowerCase().match(/^([a-z]{3})[a-z]*\s+(\d{4})$/);
    if(!m || !(m[1] in MONTHS)) return "";
    return m[2] + "-" + String(MONTHS[m[1]]+1).padStart(2,"0") + "-01";
  }

  // Today as "YYYY-MM-DD" in the reader's own timezone. Built by hand rather than
  // from toISOString(), which is UTC and can report tomorrow late in the evening.
  function isoToday(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
           "-" + String(d.getDate()).padStart(2,"0");
  }

  // "2026-08-18" -> "Aug 2026", for the display string on cards. Parsed by hand
  // because new Date("2026-08-18") is read as UTC and can slip to the month before.
  // Tolerates a trailing time, so it also works on the addedOn timestamp.
  function displayFromIso(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");
    if(!m) return "";
    return (MONTH_NAMES[+m[2]-1] || "") + " " + m[1];
  }

  // Upgrade any store to the current schema: every book gets genres[] and finishedOn.
  // Additive only — existing fields are never removed or changed. Idempotent (safe to
  // run on already-migrated data), so it also self-heals partial records.
  function migrate(s){
    if(!isValidShape(s)) return s;
    // Additive: an older store simply has nothing waiting to be filed. Absence is
    // the correct default, so this needs no key bump.
    if(!Array.isArray(s.unranked)) s.unranked = [];
    Object.keys(s.books).forEach(id=>{
      const b = s.books[id];
      if(!Array.isArray(b.genres)) b.genres = [];
      if(!b.finishedOn) b.finishedOn = isoFromDisplay(b.dateFinished);
      // v3: before this version the "finished" date was set silently to the day
      // the book was logged, so reusing it as addedOn is accurate — not a guess.
      if(!b.addedOn) b.addedOn = b.finishedOn || "";
    });
    return s;
  }

  // Load order: current v2 key first; else migrate a COPY of the old v1 data into v2
  // (leaving v1 untouched on disk as a fallback); else start empty.
  function load(){
    // Newest schema first, then fall back through the older keys. Anything older
    // is migrated into a COPY written to the current key; the old strings are
    // left untouched on disk so a bad migration is always recoverable.
    const chain = [KEY, KEY_V2, KEY_V1];
    for(let i = 0; i < chain.length; i++){
      try{
        const raw = localStorage.getItem(chain[i]);
        if(!raw) continue;
        const s = JSON.parse(raw);
        if(!isValidShape(s)) continue;
        const upgraded = migrate(s);
        if(i > 0){ try{ localStorage.setItem(KEY, JSON.stringify(upgraded)); }catch(e){} }
        return upgraded;
      }catch(e){}
    }
    return emptyStore();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ /* storage may be blocked in a sandbox preview; runs fine as a saved file */ }
  }

  // ---- Scoring ----
  // A book's score is derived from its position within its tier's band.
  // Best in tier sits at the top of the band; the rest are spread evenly below.
  // Lone book in a tier -> top of the band (your first "loved" is a 10 until dethroned).
  // To use the band MIDPOINT for a lone book instead, swap the return for n===1.
  function scoreFor(index, n, band){
    const [lo, hi] = band;
    // if(n === 1) return (lo + hi) / 2;      // <- conservative alternative
    const s = hi - (index / n) * (hi - lo);
    return Math.round(s * 10) / 10;
  }
  function scoreOf(id){
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const i = arr.indexOf(id);
    return scoreFor(i, arr.length, TIER_META[b.tier].band);
  }

  // ---- Rendering ----
  const shelfEl = document.getElementById("shelf");
  const countEl = document.getElementById("count");
  const controlsEl = document.getElementById("controls");
  const insightsBtn = document.getElementById("insightsBtn");

  // Counts only FILED books, so ranks, scores, Insights and the genre filter all
  // ignore the holding area automatically.
  function totalBooks(){ return TIERS.reduce((a,t)=>a+store.rankings[t].length,0); }
  function unfiledAll(){ return (store.unranked||[]).filter(id=> store.books[id]); }
  // Filed by a star rating rather than by the reader — still awaiting a real gut check.
  function provisionalCount(){
    let n = 0;
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{ if(store.books[id].provisional) n++; }));
    return n;
  }
  function isUnfiled(id){ return (store.unranked||[]).indexOf(id) !== -1; }
  function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // Rank/score are always derived from a book's real position in storage, by id —
  // never from where its card sits on screen. That is what makes search/sort/filter
  // view-only: reordering the display can't change any score.
  function rankInfo(id){
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const index = arr.indexOf(id);
    return { tier:b.tier, index, n:arr.length, score:scoreFor(index, arr.length, TIER_META[b.tier].band) };
  }
  // Position across the whole catalog (loved best-first, then fine, then disliked).
  function globalRank(id){
    const b = store.books[id];
    let r = 0;
    for(const t of TIERS){
      if(t === b.tier){ r += store.rankings[t].indexOf(id) + 1; break; }
      r += store.rankings[t].length;
    }
    return r;
  }

  function matchesQuery(b, q){
    if(!q) return true;
    q = q.toLowerCase();
    return (b.title||"").toLowerCase().includes(q) || (b.author||"").toLowerCase().includes(q);
  }

  // Sortable date for a book: prefer the precise finishedOn ("YYYY-MM-DD"), else derive
  // one from the "Mon YYYY" display string. ISO date strings compare chronologically as
  // plain text. Returns "" when there's no usable date (those sort last).
  function dateSortKey(b){
    return b.finishedOn || isoFromDisplay(b.dateFinished) || "";
  }

  // When the entry was logged, which is a different question from when the book
  // was finished. Pre-v3 records fall back to the finish date, because that is
  // literally what that value used to be.
  function addedSortKey(b){
    return b.addedOn || dateSortKey(b);
  }

  // Ids passing the current tier + author + search filters, in tier/rank order.
  function visibleIds(){
    const q = view.query.trim();
    const out = [];
    TIERS.forEach(t=>{
      if(view.tier!=="all" && view.tier!==t) return;
      store.rankings[t].forEach(id=>{
        const b = store.books[id];
        if(view.needsRanking && !b.provisional) return; // only what you haven't ranked yourself
        if(!matchesQuery(b, q)) return;
        if(!matchesGenre(b)) return;
        out.push(id);
      });
    });
    return out;
  }

  function sortIds(ids){
    const title = id => (store.books[id].title||"");
    const author = id => (store.books[id].author||"");
    const byTitle = (a,b)=> title(a).localeCompare(title(b), undefined, {sensitivity:"base"});
    const byAuthor = (a,b)=>{
      const aa=author(a), ba=author(b);
      if(!aa && ba) return 1; if(aa && !ba) return -1;   // unknown authors last
      return aa.localeCompare(ba, undefined, {sensitivity:"base"}) || byTitle(a,b);
    };
    const arr = ids.slice();
    if(view.sort==="title")  return arr.sort((a,b)=> byTitle(a,b) || byAuthor(a,b));
    if(view.sort==="author") return arr.sort(byAuthor);
    if(view.sort==="newest" || view.sort==="oldest" || view.sort==="added"){
      const dir = view.sort==="oldest" ? 1 : -1;
      const keyOf = view.sort==="added" ? addedSortKey : dateSortKey;
      return arr.sort((a,b)=>{
        const ka=keyOf(store.books[a]), kb=keyOf(store.books[b]);
        if(ka===kb) return byTitle(a,b);
        if(!ka) return 1;                    // undated last, both directions
        if(!kb) return -1;
        return (ka < kb ? -1 : 1) * dir;     // ISO date strings compare chronologically
      });
    }
    return arr;
  }

  function resetView(){ view = freshView(); render(); }

  // ---- Genre filter (toolbar multi-select popover) ----
  // Distinct genres with whole-catalog book counts, most-used first; plus the untagged count.
  function genreFilterOptions(){
    const counts = genreCounts(); // gkey -> count
    const names = new Map();
    usedGenres().forEach(g=> names.set(gkey(g), g));
    const list = [...counts.keys()].map(k=>({ key:k, name:names.get(k)||k, count:counts.get(k) }))
      .sort((a,b)=> b.count-a.count || a.name.localeCompare(b.name, undefined, {sensitivity:"base"}));
    let untagged = 0;
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{ if(!(store.books[id].genres||[]).length) untagged++; }));
    return { list, untagged };
  }
  function nameForKey(k){ const g = usedGenres().find(x=> gkey(x)===k); return g || null; }
  // A book passes if it has ANY of the selected genres (OR), or is untagged when that's picked.
  function matchesGenre(b){
    if(!view.genres.length) return true;
    const bg = b.genres||[];
    if(view.genres.indexOf(UNTAGGED)>=0 && bg.length===0) return true;
    return bg.some(g=> view.genres.indexOf(gkey(g))>=0);
  }
  function toggleGenreFilter(k){
    const i = view.genres.indexOf(k);
    if(i>=0) view.genres.splice(i,1); else view.genres.push(k);
  }
  function syncGenreChip(){
    const chip = document.getElementById("genreChip");
    const n = view.genres.length;
    if(n===0){ chip.textContent = "Genre"; chip.classList.remove("active"); return; } // caret is a CSS ::after
    let label;
    if(n===1){ const k=view.genres[0]; label = (k===UNTAGGED) ? "Untagged" : (nameForKey(k)||"genre"); }
    else label = n;
    chip.textContent = "Genre · " + label;
    chip.classList.add("active");
  }
  function renderGenrePop(){
    const pop = document.getElementById("genrePop");
    const { list, untagged } = genreFilterOptions();
    const row = (key, name, count, cls)=>{
      const on = view.genres.indexOf(key)>=0;
      return '<button type="button" role="menuitemcheckbox" aria-checked="'+(on?'true':'false')+'" '+
        'class="gopt'+cls+(on?' on':'')+'" data-k="'+esc(key)+'">'+
        '<span class="gopt-check">'+(on?'✓':'')+'</span>'+
        '<span class="gopt-name">'+esc(name)+'</span>'+
        '<span class="gopt-n">'+count+'</span></button>';
    };
    let html = list.map(g=> row(g.key, g.name, g.count, '')).join('');
    if(untagged>0) html += row(UNTAGGED, 'Untagged', untagged, ' untagged');
    html += '<div class="gopt-foot"><button type="button" class="glink" id="genreClear">Clear</button></div>';
    pop.innerHTML = html;
    pop.querySelectorAll(".gopt").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();               // don't let the outside-click closer fire
        toggleGenreFilter(b.dataset.k);
        const on = view.genres.indexOf(b.dataset.k)>=0;
        b.classList.toggle("on", on);       // update this row in place (keeps menu open + scroll position)
        b.setAttribute("aria-checked", on ? "true" : "false");
        b.querySelector(".gopt-check").textContent = on ? "✓" : "";
        render();
      };
    });
    document.getElementById("genreClear").onclick = (e)=>{ e.stopPropagation(); view.genres = []; render(); renderGenrePop(); };
  }
  function closeGenrePop(){
    const pop = document.getElementById("genrePop");
    if(pop && !pop.hidden){ pop.hidden = true; document.getElementById("genreChip").setAttribute("aria-expanded","false"); }
  }
  function toggleGenrePop(){
    const pop = document.getElementById("genrePop");
    if(pop.hidden){ renderGenrePop(); pop.hidden = false; document.getElementById("genreChip").setAttribute("aria-expanded","true"); }
    else closeGenrePop();
  }

  // Reflect the current view state into the controls, and rebuild the author dropdown.
  function syncControls(){
    const q = document.getElementById("q");
    if(document.activeElement!==q) q.value = view.query; // don't fight the cursor while typing
    document.getElementById("sortSel").value = view.sort;
    document.querySelectorAll("#tierChips .chip[data-tier]").forEach(chip=>{
      const on = chip.dataset.tier === view.tier;
      chip.classList.toggle("active", on);
      chip.setAttribute("aria-pressed", on ? "true" : "false");
    });
    // "Needs ranking": everything imported that you haven't placed yourself — books
    // put somewhere by their stars, plus anything still unfiled. Hides itself, and
    // clears itself, once there's nothing left to rank.
    const needs = provisionalCount() + unfiledAll().length;
    const needsEl = document.getElementById("needsChip");
    needsEl.hidden = needs === 0;
    if(needsEl.hidden) view.needsRanking = false;
    needsEl.textContent = needs ? "Needs ranking · " + needs : "Needs ranking";
    needsEl.classList.toggle("active", !!view.needsRanking);
    needsEl.setAttribute("aria-pressed", view.needsRanking ? "true" : "false");

    // genre filter: prune stale selections, show/hide the chip, reflect state in its badge
    const gf = genreFilterOptions();
    const valid = new Set(gf.list.map(o=>o.key));
    if(gf.untagged>0) valid.add(UNTAGGED);
    view.genres = view.genres.filter(k=> valid.has(k));
    const gfEl = document.getElementById("genreFilter");
    gfEl.hidden = gf.list.length===0;      // nothing tagged yet → no genre filter
    if(gfEl.hidden) view.genres = [];
    syncGenreChip();
  }

  function render(highlightId){
    const total = totalBooks();
    const waiting = unfiledAll();
    shelfEl.innerHTML = "";

    // Only a genuinely empty catalog gets the empty state. Someone whose whole
    // import was unrated has books waiting, so the drawers are not "empty".
    if(total === 0 && waiting.length === 0){
      controlsEl.hidden = true;
      insightsBtn.hidden = true;
      countEl.textContent = "0 volumes";
      shelfEl.innerHTML =
        '<div class="empty"><h2>The drawers are empty.</h2>'+
        "<p>The first book you file becomes the baseline everything else is measured against. "+
        'Log one you\'ve recently finished to start the catalog.</p>'+
        '<button class="add-btn" id="emptyAdd">＋ Log your first book</button></div>';
      document.getElementById("emptyAdd").onclick = openAdd;
      return;
    }

    controlsEl.hidden = false;
    insightsBtn.hidden = (total === 0); // nothing ranked yet, so there's nothing to analyse
    insightsBtn.classList.toggle("promoted", total >= INSIGHTS_MIN); // fill it in once Insights is worth opening
    syncControls();

    const ids = visibleIds();
    let label = (ids.length!==total)
      ? ids.length + " of " + total + (total===1?" volume":" volumes")
      : total + (total===1?" volume":" volumes");
    if(waiting.length) label += " · " + waiting.length + " unfiled";
    countEl.textContent = label;

    const showUnfiled = unfiledToShow(waiting);

    // Only say "nothing matches" when genuinely nothing will be drawn — otherwise
    // that message would sit above a shelf full of visible books.
    if(ids.length === 0 && showUnfiled.length === 0 && total > 0){
      const box = document.createElement("div");
      box.className = "empty";
      box.innerHTML =
        '<h2>No books match your filters.</h2>'+
        '<p>Nothing fits the current search and filters. Loosen them, or clear '+
        'everything to see all '+total+' books.</p>'+
        '<button class="add-btn" id="clearFilters">Clear search &amp; filters</button>';
      shelfEl.appendChild(box);
      document.getElementById("clearFilters").onclick = resetView;
      markExpandableNotes();
      return;
    }

    if(ids.length && view.sort === "score"){
      TIERS.forEach(tier=>{
        const tierIds = ids.filter(id=> store.books[id].tier===tier);
        if(!tierIds.length) return;
        const drawer = document.createElement("section");
        drawer.className = "drawer";
        drawer.dataset.tier = tier;
        drawer.innerHTML = '<div class="drawer-label">'+TIER_META[tier].label+
          ' <span class="n">'+tierIds.length+'</span></div>';
        tierIds.forEach(id=> drawer.appendChild(cardEl(id, id===highlightId)));
        shelfEl.appendChild(drawer);
      });
    } else if(ids.length){
      const list = document.createElement("section");
      list.className = "drawer flatlist";
      sortIds(ids).forEach(id=> list.appendChild(cardEl(id, id===highlightId)));
      shelfEl.appendChild(list);
    }
    renderUnfiled(showUnfiled);
    markExpandableNotes();
  }

  // Which unfiled books the current view should show. Search still applies, but the
  // tier and genre filters don't: those ask about a judgement these books lack.
  // "Needs ranking" is precisely about them, so it always lets them through.
  function unfiledToShow(waiting){
    if(!waiting.length) return [];
    if(!view.needsRanking && (view.tier !== "all" || (view.genres||[]).length)) return [];
    const q = view.query.trim();
    return waiting.filter(id=> matchesQuery(store.books[id], q));
  }

  // The holding area, drawn below the ranked drawers.
  function renderUnfiled(shown){
    if(!shown.length) return;
    const sec = document.createElement("section");
    sec.className = "drawer unfiled-drawer";
    sec.innerHTML =
      '<div class="drawer-label">Read, not yet filed <span class="n">'+shown.length+'</span></div>'+
      '<p class="unfiled-note">No score and no rank until you decide where each one sits.</p>';
    shown.forEach(id=> sec.appendChild(cardEl(id, false, true)));
    shelfEl.appendChild(sec);
  }

  // Start the tier-pick-and-compare flow for an imported book — either one with no
  // tier at all, or one placed by its star rating and awaiting a real gut check.
  // Nothing is written until the flow finishes, so cancelling changes nothing.
  function startFiling(id){
    const b = store.books[id];
    flow = { mode:"add", step:"tier", reId:id, tier:null,
             title:b.title, author:b.author, takeaway:b.takeaway };
    renderFlow(); openModal();
  }

  function cardEl(id, highlight, unfiled){
    const b = store.books[id];
    const c = document.createElement("div");
    c.className = "card" + (highlight ? " just-filed" : "") + (unfiled ? " is-unfiled" : "");
    const metaBits = [b.author ? esc(b.author) : "Unknown author"];
    if(b.dateFinished) metaBits.push(b.dateFinished);

    // An unfiled book has no tier, so it has no score and no rank to show — asking
    // for either would be claiming a judgement the reader hasn't made.
    let stampHtml, label;
    if(unfiled){
      c.dataset.tier = "unfiled";
      label = b.title + (b.author ? " by " + b.author : "") + ", not yet filed";
      stampHtml = '<div class="stamp stamp-unfiled"><span class="rank">unfiled</span></div>';
    } else {
      const info = rankInfo(id);
      const score = info.score.toFixed(1);
      const gr = globalRank(id), tot = totalBooks();
      c.dataset.tier = info.tier; // sets the left-stripe color even outside a drawer
      label = b.title + ", " + TIER_META[info.tier].label + ", call number " + score +
              ", ranked " + gr + " of " + tot + " overall";
      stampHtml = '<div class="stamp"><span class="num">'+score+'</span>'+
                  '<span class="rank">#'+gr+' of '+tot+'</span></div>';
    }

    // Top zone: the real keyboard control, carrying the card's whole announcement.
    const main = document.createElement("div");
    main.className = "card-main";
    main.tabIndex = 0;
    main.setAttribute("role","button");
    main.setAttribute("aria-label", label);
    main.innerHTML =
      '<h3 class="title">'+esc(b.title)+'</h3>'+
      stampHtml+
      '<div class="meta">'+metaBits.join(" · ")+'</div>'+
      (Array.isArray(b.genres)&&b.genres.length ? '<div class="gtags">'+b.genres.map(g=>'<span class="gtag">'+esc(g)+'</span>').join("")+'</div>' : "");
    main.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(id); } };
    c.appendChild(main);

    // Bottom zone. The "more" cue sits outside .note-text so the clamp can't hide it.
    if(b.takeaway){
      const note = document.createElement("div");
      note.className = "note";
      note.dataset.id = id;
      note.innerHTML = '<div class="note-text">“'+esc(b.takeaway)+'”</div>'+
                       '<button type="button" class="note-more" aria-expanded="false"></button>';
      c.appendChild(note);
    }

    // Both kinds of imported book need the reader to place them: one has no tier at
    // all, the other was put somewhere by its star rating. One tap starts the same
    // gut-check flow for either. Sibling of .card-main, never inside it — the same
    // reason the note's more/less button sits outside.
    if(unfiled || b.provisional){
      const act = document.createElement("div");
      act.className = "cardact";
      // Status and its action share one row, so a provisional card stays close to
      // the height of a ranked one.
      act.innerHTML =
        (b.provisional ? '<span class="prov">not yet ranked by you</span>' : '<span></span>')+
        '<button type="button" class="filebtn">'+
        (unfiled ? 'File this book' : 'Rank this book')+'</button>';
      act.querySelector(".filebtn").onclick = (e)=>{ e.stopPropagation(); startFiling(id); };
      c.appendChild(act);
    }

    // Clicking anywhere the note hasn't claimed opens the detail view, so the
    // card's padding and rim stay live exactly as before.
    c.onclick = ()=>openDetail(id);
    return c;
  }

  // A note is only promoted to its own control when the 3-line clamp is really
  // hiding text. Runs after cards are in the document, because it measures layout.
  function markExpandableNotes(){
    shelfEl.querySelectorAll(".card .note").forEach(note=>{
      const txt = note.querySelector(".note-text");
      note.classList.remove("expanded");           // measure the collapsed height
      if(txt.scrollHeight <= txt.clientHeight + 1){
        note.classList.remove("is-expandable");
        note.onclick = null;
        return;
      }
      note.classList.add("is-expandable");
      applyNoteState(note, expandedNotes.has(note.dataset.id));
      // Band click is the touch/mouse convenience; the button below is the
      // control keyboard and screen-reader users actually land on.
      note.onclick = (e)=>{ e.stopPropagation(); toggleNote(note); };
      note.querySelector(".note-more").onclick = (e)=>{ e.stopPropagation(); toggleNote(note); };
    });
  }

  function applyNoteState(note, open){
    note.classList.toggle("expanded", open);
    const btn = note.querySelector(".note-more");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.textContent = open ? "less" : "more";
  }

  function toggleNote(note){
    const id = note.dataset.id;
    const open = !expandedNotes.has(id);
    if(open) expandedNotes.add(id); else expandedNotes.delete(id);
    applyNoteState(note, open);
  }

  // ---- Genres (tag picker shared by the add flow and the detail view) ----
  // Match key: case-, space-, and punctuation-insensitive, so "Sci-Fi", "sci fi" and
  // "scifi" all collapse to the same genre.
  function gkey(g){ return (g||"").toLowerCase().replace(/[^a-z0-9]+/g,""); }
  function hasGenre(list, g){ const k=gkey(g); return (list||[]).some(x=> gkey(x)===k); }
  function addGenre(g){ if(flow.genres.length < MAX_GENRES && !hasGenre(flow.genres, g)) flow.genres.push(g); }
  function usedGenres(){
    const map = new Map(); // gkey -> canonical spelling actually stored
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      (store.books[id].genres||[]).forEach(g=>{ const k=gkey(g); if(!map.has(k)) map.set(k,g); });
    }));
    return [...map.values()];
  }
  function genreCounts(){
    const counts = new Map(); // gkey -> how many books use it
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      (store.books[id].genres||[]).forEach(g=>{ const k=gkey(g); counts.set(k,(counts.get(k)||0)+1); });
    }));
    return counts;
  }
  // Chip options: starter set + the reader's own genres (used or selected), deduped, then
  // ordered MOST-USED first (ties alphabetical) so frequent genres sit at the top.
  function genreOptions(selected){
    const seen = new Set(); const list = [];
    const push = g => { const k=gkey(g); if(k && !seen.has(k)){ seen.add(k); list.push(g); } };
    STARTER_GENRES.forEach(push);
    usedGenres().forEach(push);
    (selected||[]).forEach(push);
    const counts = genreCounts();
    return list.sort((a,b)=>{
      const ca=counts.get(gkey(a))||0, cb=counts.get(gkey(b))||0;
      return cb!==ca ? cb-ca : a.localeCompare(b, undefined, {sensitivity:"base"});
    });
  }
  function toggleGenre(g){
    const k=gkey(g);
    if(flow.genres.some(x=> gkey(x)===k)) flow.genres = flow.genres.filter(x=> gkey(x)!==k);
    else if(flow.genres.length < MAX_GENRES) flow.genres.push(g);   // ignore adds past the cap
  }
  // Levenshtein edit distance — how many single-character edits turn one string into another.
  function editDistance(a,b){
    const m=a.length, n=b.length;
    if(!m) return n; if(!n) return m;
    let prev=[...Array(n+1).keys()], cur=new Array(n+1);
    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      }
      const t=prev; prev=cur; cur=t;
    }
    return prev[n];
  }
  // Closest existing option to a typed genre (by normalized edit distance) — powers the
  // "did you mean?" nudge. Returns null unless something is genuinely close (a likely typo).
  function nearestGenre(typed){
    const kt=gkey(typed); if(!kt) return null;
    let best=null, bestD=Infinity;
    genreOptions(flow.genres).forEach(o=>{
      const ko=gkey(o); if(ko===kt) return;
      const d=editDistance(kt,ko);
      if(d<bestD){ bestD=d; best=o; }
    });
    const thresh = kt.length<=4 ? 1 : 2;
    return (best && bestD>0 && bestD<=thresh) ? best : null;
  }
  // Fills #genreBox from flow.genres and re-renders on any change, so a just-added custom
  // genre immediately becomes a reusable chip.
  function renderGenreBox(){
    const box = document.getElementById("genreBox");
    if(!box) return;
    const atLimit = flow.genres.length >= MAX_GENRES;
    let html = '<div class="gchips">';
    genreOptions(flow.genres).forEach(g=>{
      const on = hasGenre(flow.genres, g);
      const dis = (!on && atLimit) ? " disabled" : ""; // at the cap, only selected chips stay tappable
      html += '<button type="button" class="gchip'+(on?" on":"")+'"'+dis+' data-g="'+esc(g)+'" aria-pressed="'+(on?"true":"false")+'">'+esc(g)+'</button>';
    });
    html += '</div>'+
      (atLimit ? '<div class="ghint">'+MAX_GENRES+' genres max — remove one to add another.</div>' : '')+
      '<div class="gadd">'+
        '<input type="text" id="gInput" class="gadd-input" placeholder="'+(atLimit?"At the "+MAX_GENRES+"-genre limit":"Add your own…")+'"'+(atLimit?" disabled":"")+' aria-label="Add a custom genre" autocomplete="off">'+
        '<button type="button" class="btn ghost gadd-btn" id="gAdd"'+(atLimit?" disabled":"")+'>Add</button>'+
      '</div>'+
      (flow.gSuggest ? '<div class="gsuggest">Did you mean <button type="button" class="glink" id="gUse">'+esc(flow.gSuggest.suggestion)+'</button>?'+
        ' <button type="button" class="glink alt" id="gKeep">Add “'+esc(flow.gSuggest.typed)+'” instead</button></div>' : '');
    box.innerHTML = html;
    const focusInput = ()=>{ const gi=document.getElementById("gInput"); if(gi && !gi.disabled) gi.focus(); };
    box.querySelectorAll(".gchip").forEach(ch=>{ ch.onclick = ()=>{ flow.gSuggest=null; toggleGenre(ch.dataset.g); renderGenreBox(); }; });
    const input = document.getElementById("gInput");
    const add = ()=>{
      const g = (input.value||"").trim().replace(/\s+/g," ");
      if(!g) return;
      const exact = genreOptions(flow.genres).find(o=> gkey(o)===gkey(g)); // formatting/case variant
      if(exact){ addGenre(exact); flow.gSuggest=null; renderGenreBox(); focusInput(); return; }
      const near = nearestGenre(g);
      if(near){ flow.gSuggest = { typed:g, suggestion:near }; renderGenreBox(); return; } // suggest, don't silently merge
      addGenre(g); flow.gSuggest=null; renderGenreBox(); focusInput();
    };
    document.getElementById("gAdd").onclick = add;
    input.onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
    if(flow.gSuggest){
      document.getElementById("gUse").onclick = ()=>{ addGenre(flow.gSuggest.suggestion); flow.gSuggest=null; renderGenreBox(); focusInput(); };
      document.getElementById("gKeep").onclick = ()=>{ addGenre(flow.gSuggest.typed); flow.gSuggest=null; renderGenreBox(); focusInput(); };
    }
  }

  // ---- Insights (P3) — read-only reflection of the catalog ----
  // Per-genre { name, count, avg score }, computed from the current derived scores.
  function genreStats(){
    const m = new Map(); // gkey -> {name, count, sum}
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      const sc = scoreOf(id);
      (store.books[id].genres||[]).forEach(g=>{
        const k = gkey(g);
        if(!m.has(k)) m.set(k, { name:g, count:0, sum:0 });
        const e = m.get(k); e.count++; e.sum += sc;
      });
    }));
    return [...m.values()].map(e=>({ name:e.name, count:e.count, avg:e.sum/e.count }));
  }
  function openInsights(){ renderInsights(); openModal(); }
  function renderInsights(){
    flow = { mode:"insights" };
    const total = totalBooks();
    if(total < INSIGHTS_MIN){
      sheet.innerHTML =
        '<h2 id="sheetTitle">Your reading in numbers</h2>'+
        '<p class="step-tag">A little more to chew on</p>'+
        '<p class="modal-copy">You’ve logged <b>'+total+'</b> '+(total===1?'book':'books')+'. About '+
        '<b>'+(INSIGHTS_MIN-total)+'</b> more and this view starts showing patterns — which tiers and '+
        'genres you gravitate to, and what you rate highest.</p>'+
        '<div class="row"><button class="btn primary" id="ins-ok">Back to the stacks</button></div>';
      document.getElementById("ins-ok").onclick = closeModal;
      return;
    }
    const barColor = { loved:"var(--gold)", fine:"var(--sage)", disliked:"var(--brick)" };
    let html =
      '<h2 id="sheetTitle">Your reading in numbers</h2>'+
      '<p class="step-tag">'+total+' volumes</p>'+
      '<div class="ins-lab">How they landed</div>';
    TIERS.forEach(t=>{
      const n = store.rankings[t].length;
      const w = Math.round(n/total*100);
      html += '<div class="ins-row"><div class="ins-name">'+TIER_META[t].label+'</div>'+
        '<div class="ins-track"><div class="ins-fill" style="width:'+w+'%; background:'+barColor[t]+'"></div></div>'+
        '<div class="ins-num">'+n+'</div></div>';
    });

    const stats = genreStats();
    if(stats.length === 0){
      html += '<p class="modal-copy soft" style="margin-top:20px">Tag some books with genres (from a book’s page) to unlock genre insights here.</p>';
    } else {
      const byCount = stats.slice().sort((a,b)=> b.count-a.count || a.name.localeCompare(b.name));
      const cMax = byCount[0].count;
      html += '<div class="ins-lab">Genres you read most</div>';
      byCount.slice(0,5).forEach(s=>{
        const w = Math.round(s.count/cMax*100);
        html += '<div class="ins-row"><div class="ins-name serif" title="'+esc(s.name)+'">'+esc(s.name)+'</div>'+
          '<div class="ins-track"><div class="ins-fill" style="width:'+w+'%; background:var(--ink-soft)"></div></div>'+
          '<div class="ins-num">'+s.count+'</div></div>';
      });

      const rated = stats.filter(s=> s.count>=GENRE_MIN).sort((a,b)=> b.avg-a.avg || a.name.localeCompare(b.name));
      html += '<div class="ins-lab">Genres you rate highest</div>';
      if(rated.length){
        html += '<p class="ins-note">average call number · genres with '+GENRE_MIN+'+ books</p>';
        rated.slice(0,5).forEach(s=>{
          html += '<div class="ins-rated"><span class="ins-rname">'+esc(s.name)+'</span>'+
            '<span class="ins-stamp">'+s.avg.toFixed(1)+'</span></div>';
        });
      } else {
        html += '<p class="ins-note">A few more books per genre ('+GENRE_MIN+'+) and you’ll see which you rate highest.</p>';
      }

      const tagInstances = stats.reduce((a,s)=>a+s.count,0);
      const obs = [];
      if(byCount.length>=2 && tagInstances>0 && (byCount[0].count+byCount[1].count)/tagInstances >= 0.5){
        obs.push('Most of your reading sits in two genres — <b>'+esc(byCount[0].name)+'</b> and <b>'+esc(byCount[1].name)+'</b>.');
      }
      if(rated.length){
        obs.push('You rate <b>'+esc(rated[0].name)+'</b> highest on average ('+rated[0].avg.toFixed(1)+').');
      }
      if(obs.length) html += '<div class="ins-obs">'+obs.join(' ')+'</div>';
    }

    html += '<div class="row" style="margin-top:22px"><button class="btn primary" id="ins-ok">Back to the stacks</button></div>';
    sheet.innerHTML = html;
    document.getElementById("ins-ok").onclick = closeModal;
  }

  // ---- Modal plumbing ----
  const scrim = document.getElementById("scrim");
  const sheet = document.getElementById("sheet");
  function openModal(){ scrim.classList.add("open"); }
  function closeModal(){ scrim.classList.remove("open"); flow=null; }
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && scrim.classList.contains("open")) closeModal(); });

  // ---- Add flow ----
  function openAdd(){
    flow = { mode:"add", step:"meta", title:"", author:"", takeaway:"", tier:null,
             genres:[], finishedOn: isoToday() };
    renderFlow(); openModal();
  }
  document.getElementById("addBtn").onclick = openAdd;

  function renderFlow(){
    if(flow.mode==="detail") return renderDetail();
    if(flow.step==="meta")    return renderMeta();
    if(flow.step==="tier")    return renderTier();
    if(flow.step==="compare") return renderCompare();
    if(flow.step==="done")    return renderDone();
  }

  // ---- v2 (online): Open Library title lookup ----
  // ENHANCEMENT ONLY. If the network is down or the API fails, the title/author boxes still
  // work as plain text (see the catch + the manual fallback). The only thing that ever leaves
  // the device is the title text being looked up — never the reading list, scores, or notes.
  const OL_SEARCH = "https://openlibrary.org/search.json";
  const olCache = new Map();  // lowercased query -> ranked results (in-memory, this session only)
  let olTimer = null;         // debounce timer
  let olController = null;     // AbortController for the in-flight request, so we can cancel it
  let olResults = [];         // results currently shown (so the keyboard can select one)
  let olActive = -1;          // highlighted row for keyboard nav (-1 = none)

  // Turn Open Library's noisy docs into a short, clean list:
  // - keep only entries that have a title AND an author
  // - collapse duplicate editions of one work (same title + first-publish year), keeping the
  //   fuller author name (so "Donna Tartt" wins over a bare "Tartt")
  function betterAuthor(a, b){
    const sa = a.includes(" "), sb = b.includes(" ");   // a full "First Last" beats a lone surname
    return sa !== sb ? sa : a.length > b.length;
  }
  function rankResults(docs){
    const seen = new Map(); const out = [];
    (docs || []).forEach(d=>{
      if(!d.title || !d.author_name || !d.author_name.length) return;
      const r = { title:d.title, author:d.author_name[0], year:d.first_publish_year || null };
      const key = r.title.toLowerCase().replace(/[^a-z0-9]/g,"") + "|" + (r.year || "");
      if(seen.has(key)){
        const ex = out[seen.get(key)];
        if(betterAuthor(r.author, ex.author)) ex.author = r.author;
      }else{ seen.set(key, out.length); out.push(r); }
    });
    return out.slice(0, 5);
  }

  // Ask Open Library for matches. Returns [{title, author, year}]. Throws on failure/abort.
  async function olLookup(q, signal){
    const key = q.toLowerCase();
    if(olCache.has(key)) return olCache.get(key);            // don't re-ask for something we've seen
    const url = OL_SEARCH + "?title=" + encodeURIComponent(q) +
      "&fields=title,author_name,first_publish_year&limit=8"; // a few extra to survive dedupe
    const res = await fetch(url, { signal });                // { signal } lets us cancel this request
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const results = rankResults(data.docs);
    olCache.set(key, results);
    return results;
  }

  // These helpers take a ctx = { title:<input>, author:<input>, box:<div> } so the same lookup
  // works for both the add flow and editing a book's title in the detail view.
  function hideSuggest(box){ if(box){ box.hidden=true; box.innerHTML=""; } olResults=[]; olActive=-1; }

  function selectResult(ctx, i){
    const r = olResults[i]; if(!r) return;
    ctx.title.value = r.title;    // fill title
    ctx.author.value = r.author; // ...and author (the whole point)
    hideSuggest(ctx.box);
    ctx.author.focus();
  }
  function paintActive(box){
    const items = box.querySelectorAll(".suggest-item");
    items.forEach((el,i)=> el.classList.toggle("active", i===olActive));
    if(olActive>=0 && items[olActive]) items[olActive].scrollIntoView({block:"nearest"});
  }

  // Render one of: "loading" | "error" | "empty" | an array of results into ctx.box.
  function renderSuggest(ctx, state){
    const box = ctx.box;
    if(!box) return;
    olResults = []; olActive = -1;
    if(state === "loading"){ box.innerHTML = '<div class="suggest-msg">Searching Open Library…</div>'; box.hidden=false; return; }
    if(state === "error"){ box.innerHTML = '<div class="suggest-msg">Couldn’t reach the lookup — just type it in.</div>'; box.hidden=false; return; }
    if(state === "empty"){ box.innerHTML = '<div class="suggest-msg">No match — keep typing, or enter it yourself.</div>'; box.hidden=false; return; }
    olResults = state;
    box.innerHTML = state.map((r,i)=>
      '<button type="button" role="option" class="suggest-item" data-i="'+i+'">'+
        '<span class="suggest-t">'+esc(r.title)+'</span>'+                        // esc(): external data must be escaped
        '<span class="suggest-a">'+esc(r.author)+(r.year?' · '+r.year:'')+'</span>'+
      '</button>').join('');
    box.hidden = false;
    box.querySelectorAll(".suggest-item").forEach(b=>{
      b.onmousedown = (e)=>{ e.preventDefault(); };   // fire before the input's blur so the pick lands
      b.onclick = ()=> selectResult(ctx, +b.dataset.i);
    });
  }

  // Attach the debounced lookup + keyboard nav to a title input.
  // ctx = { title:<input>, author:<input>, box:<div> }. Used by the add flow AND the detail edit.
  function wireTitleLookup(ctx){
    ctx.title.addEventListener("input", ()=>{
      const q = ctx.title.value.trim();
      clearTimeout(olTimer);
      if(olController) olController.abort();          // cancel any request still in flight
      if(q.length < 3){ hideSuggest(ctx.box); return; } // min length: don't search fragments
      olTimer = setTimeout(()=>{                       // debounce: wait for a pause in typing
        olController = new AbortController();
        renderSuggest(ctx, "loading");
        olLookup(q, olController.signal).then(results=>{
          renderSuggest(ctx, results.length ? results : "empty");
        }).catch(err=>{
          if(err && err.name === "AbortError") return; // superseded by a newer keystroke — ignore
          renderSuggest(ctx, "error");                 // real failure != "no book" — say we couldn't check
        });
      }, 300);
    });
    ctx.title.addEventListener("keydown", e=>{
      if(ctx.box.hidden) return;                       // when closed, let Escape reach the modal closer
      if(e.key === "ArrowDown"){ e.preventDefault(); olActive = Math.min(olActive+1, olResults.length-1); paintActive(ctx.box); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); olActive = Math.max(olActive-1, 0); paintActive(ctx.box); }
      else if(e.key === "Enter" && olActive >= 0){ e.preventDefault(); selectResult(ctx, olActive); }
      else if(e.key === "Escape"){ e.stopPropagation(); hideSuggest(ctx.box); } // close the dropdown, not the modal
    });
    ctx.title.addEventListener("blur", ()=>{ setTimeout(()=>hideSuggest(ctx.box), 150); }); // let a click land first
  }

  function renderMeta(){
    sheet.innerHTML =
      '<h2 id="sheetTitle">Log a finished book</h2>'+
      '<p class="step-tag">Step 1 of 3 · the details</p>'+
      '<div class="fld title-fld">'+
        '<span class="fld-lab">Title'+
          ' <button type="button" class="info-i" id="titleInfo" aria-label="About the online title lookup" aria-expanded="false">ⓘ</button>'+
        '</span>'+
        '<div class="info-note" id="titleInfoNote" hidden>Typing here looks the title up on Open Library to fill in the author. Only the title text is sent — never your list, scores, or notes.</div>'+
        '<div class="ti-wrap">'+
          '<input id="f-title" value="'+esc(flow.title)+'" autocomplete="off">'+
          '<div class="suggest" id="f-suggest" role="listbox" aria-label="Title suggestions" hidden></div>'+
        '</div>'+
      '</div>'+
      '<label class="fld"><span>Author</span><input id="f-author" value="'+esc(flow.author)+'" autocomplete="off"></label>'+
      '<label class="fld"><span>Finished on — optional</span>'+
        '<input type="date" id="f-date" value="'+esc(flow.finishedOn||"")+'" max="'+isoToday()+'"></label>'+
      '<label class="fld"><span>A line to remember it by — optional</span>'+
        '<textarea id="f-take" rows="2" placeholder="one thought, a favorite quote, why it stuck">'+esc(flow.takeaway)+'</textarea></label>'+
      '<div class="gsection"><span class="gsection-lab">Genres — optional (up to '+MAX_GENRES+')</span><div id="genreBox"></div></div>'+
      '<div class="row">'+
        '<button class="btn ghost" id="f-cancel">Cancel</button>'+
        '<button class="btn primary" id="f-next">Next</button>'+
      '</div>';
    if(!Array.isArray(flow.genres)) flow.genres = [];
    renderGenreBox();
    const titleInput = document.getElementById("f-title");
    titleInput.focus();
    wireTitleLookup({ title:titleInput, author:document.getElementById("f-author"), box:document.getElementById("f-suggest") }); // v2: attach the online lookup
    document.getElementById("titleInfo").onclick = ()=>{
      const note = document.getElementById("titleInfoNote"), btn = document.getElementById("titleInfo");
      const open = note.hidden; note.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-next").onclick = ()=>{
      const t = titleInput.value.trim();
      if(!t){ titleInput.focus(); titleInput.style.borderColor="var(--stamp)"; return; }
      flow.title = t;
      flow.author = document.getElementById("f-author").value.trim();
      flow.takeaway = document.getElementById("f-take").value.trim();
      flow.finishedOn = document.getElementById("f-date").value; // "" if cleared
      flow.step = "tier";
      renderFlow();
    };
  }

  function renderTier(){
    const reranking = !!flow.reId;
    const currentTier = reranking ? store.books[flow.reId].tier : null;
    // Three different situations, three different truths:
    //  - no tier at all  -> being filed for the very first time
    //  - provisional     -> a star rating put it here; the reader hasn't confirmed it
    //  - neither         -> a genuine re-rank of a book they already placed
    const filingFresh = reranking && !currentTier;
    const confirming  = reranking && !!currentTier && !!store.books[flow.reId].provisional;
    let picks = "";
    TIERS.forEach(t=>{
      const m = TIER_META[t];
      const cur = t===currentTier ? ' <span class="tier-cur">· current</span>' : "";
      picks += '<button class="tier-pick" data-t="'+t+'"><b>'+m.label+cur+'</b>'+
               '<small>'+m.sub+'</small></button>';
    });
    sheet.innerHTML =
      '<h2 id="sheetTitle">'+(filingFresh || confirming || !reranking
          ? 'How did “'+esc(flow.title)+'” land?'
          : 'Re-file “'+esc(flow.title)+'”')+'</h2>'+
      '<p class="step-tag">'+(filingFresh
          ? 'Filing it for the first time · gut check first, comparison after'
          : confirming
            ? 'Its stars put it here — confirm the tier or change it, then rank it'
            : reranking
              ? 'Pick a tier — keep it here or move it, then re-rank'
              : 'Step 2 of 3 · gut check first, comparison after')+'</p>'+
      '<div class="tiers">'+picks+'</div>'+
      '<div class="step-back"><button type="button" class="inline-act quiet" id="t-back">← Back</button></div>';
    document.getElementById("t-back").onclick = ()=>{
      if(reranking){ openDetail(flow.reId); } else { flow.step="meta"; renderFlow(); }
    };
    sheet.querySelectorAll(".tier-pick").forEach(btn=>{
      btn.onclick = ()=>{ flow.tier = btn.dataset.t; startPlacement(); };
    });
  }

  // Begin binary-search placement within the chosen tier.
  // The comparison pool excludes the book being re-ranked (flow.reId), so a book is
  // never compared against itself. For a brand-new book, reId is undefined and the
  // filter removes nothing.
  function startPlacement(){
    flow.pool = store.rankings[flow.tier].filter(x => x !== flow.reId);
    if(flow.pool.length === 0){ finalize(0); return; }
    flow.lo = 0; flow.hi = flow.pool.length; flow.round = 0;
    flow.history = [];   // one entry per answered comparison, so Back can undo a misclick
    flow.step = "compare";
    renderFlow();
  }

  // Undo the last comparison. round is set one below the saved value because
  // renderCompare increments it again as it draws.
  function stepBackComparison(){
    const prev = (flow.history || []).pop();
    if(!prev) return;
    flow.lo = prev.lo; flow.hi = prev.hi; flow.round = prev.round - 1;
    renderFlow();
  }

  function renderCompare(){
    const arr = flow.pool;
    // resolved?
    if(flow.lo >= flow.hi){ finalize(flow.lo); return; }
    flow.round++;
    const mid = Math.floor((flow.lo + flow.hi) / 2);
    const rival = store.books[arr[mid]];
    // A book leaving the holding area is being filed for the first time, so it isn't
    // being "re-ranked" — it has never had a rank.
    const firstFiling = flow.reId &&
      (!store.books[flow.reId].tier || !!store.books[flow.reId].provisional);
    const tag = (flow.reId && !firstFiling)
      ? 'Re-ranking · comparison '+flow.round+' · '+TIER_META[flow.tier].label
      : 'Comparison '+flow.round+' · filed under '+TIER_META[flow.tier].label;
    const newSub = flow.author ? esc(flow.author)
                 : (flow.reId ? (firstFiling ? "the book you're filing" : "the book you're re-ranking")
                              : "your new entry");
    sheet.innerHTML =
      '<h2 id="sheetTitle">Which did you enjoy more?</h2>'+
      '<p class="step-tag">'+tag+'</p>'+
      '<div class="versus">'+
        '<button class="pick" id="p-new"><span class="pt">'+esc(flow.title)+'</span>'+
          '<span class="pa">'+newSub+'</span></button>'+
        '<button class="pick" id="p-old"><span class="pt">'+esc(rival.title)+'</span>'+
          '<span class="pa">'+(rival.author?esc(rival.author):"already filed")+'</span></button>'+
      '</div>'+
      // Centred under the choices and kept deliberately small: this screen repeats
      // dozens of times during an import, so the undo must not bulk it out.
      '<div class="step-back"><button type="button" class="inline-act quiet" id="c-back">'+
        '← Back</button></div>';
    // Remember where this comparison started before narrowing, so Back can restore it.
    const choose = (nextLo, nextHi)=>{
      if(!Array.isArray(flow.history)) flow.history = [];
      flow.history.push({ lo:flow.lo, hi:flow.hi, round:flow.round });
      flow.lo = nextLo; flow.hi = nextHi;
      renderFlow();
    };
    document.getElementById("p-new").onclick = ()=> choose(flow.lo, mid);       // new wins -> upper half
    document.getElementById("p-old").onclick = ()=> choose(mid + 1, flow.hi);   // rival wins -> lower half
    document.getElementById("c-back").onclick = ()=>{
      // Step back through the comparisons, then out to the tier choice.
      if((flow.history||[]).length) stepBackComparison();
      else { flow.step = "tier"; renderFlow(); }
    };
  }

  function finalize(index){
    let id;
    if(flow.reId){
      // Re-rank: reuse the existing book (keeps its note/title/author/date).
      // Pull it out of its old tier list, then re-file it in the chosen tier below.
      id = flow.reId;
      const old = store.books[id].tier;
      // An unfiled book has no old tier to be pulled out of — it leaves the
      // holding area instead.
      if(old && store.rankings[old]) store.rankings[old] = store.rankings[old].filter(x => x !== id);
      if(Array.isArray(store.unranked)) store.unranked = store.unranked.filter(x => x !== id);
      store.books[id].tier = flow.tier;
      delete store.books[id].provisional; // re-ranking is the reader claiming the position
    } else {
      id = "b" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
      const fin = flow.finishedOn || "";   // the reader's own date, or none at all
      store.books[id] = {
        id, title:flow.title, author:flow.author, takeaway:flow.takeaway, tier:flow.tier,
        genres: Array.isArray(flow.genres) ? flow.genres : [],
        dateFinished: displayFromIso(fin), // derived; "" when no finish date is set
        finishedOn: fin,
        // Full timestamp, not just the day: a bulk import lands many books on one
        // date, and day-precision would collapse "Recently added" into A-Z order.
        addedOn: new Date().toISOString()
      };
    }
    const arr = store.rankings[flow.tier];
    const clamped = Math.max(0, Math.min(index, arr.length));
    arr.splice(clamped, 0, id);
    save();
    flow = { mode:"add", step:"done", placedId:id, wasReRank: !!flow.reId };
    renderFlow();
  }

  function renderDone(){
    const id = flow.placedId;
    const wasRe = flow.wasReRank;
    const b = store.books[id];
    const rank = globalRank(id);      // overall position across the whole catalog
    const total = totalBooks();
    const score = scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<div class="confirm">'+
        '<div class="big-stamp" data-tier="'+b.tier+'"><span class="num">'+score+'</span></div>'+
        '<p>'+(wasRe?"Re-filed":"Filed")+' <b>“'+esc(b.title)+'”</b> under <b>'+TIER_META[b.tier].label+'</b>, '+
        'ranked <b>#'+rank+' of '+total+'</b> overall.<br>'+
        'Its call number moves as you file more nearby.</p>'+
      '</div>'+
      '<div class="row" style="justify-content:center; margin-top:24px">'+
        (wasRe ? "" : '<button class="btn ghost" id="d-again">Log another</button>')+
        '<button class="btn primary" id="d-done">Back to the stacks</button>'+
      '</div>';
    if(!wasRe) document.getElementById("d-again").onclick = openAdd;
    document.getElementById("d-done").onclick = ()=>{ const hl=id; closeModal(); render(hl); };
    if(!wasRe) view = freshView(); // a new book: clear filters so it's visible
    render(id); // refresh shelf underneath
  }

  // ---- Detail / edit / remove ----
  function openDetail(id){
    flow = { mode:"detail", id, genres:(store.books[id].genres||[]).slice() };
    renderDetail(); openModal();
  }
  function renderDetail(){
    const id = flow.id;
    const b = store.books[id];
    const unfiled = isUnfiled(id) || !b.tier;
    const rank = unfiled ? 0 : globalRank(id);
    const score = unfiled ? "" : scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<h2 id="sheetTitle" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Book details</h2>'+
      '<div class="detail-head">'+
        '<div style="flex:1; min-width:0">'+
          '<div class="ti-wrap">'+
            '<input id="d-title" class="d-title-input" value="'+esc(b.title)+'" aria-label="Title" autocomplete="off">'+
            '<div class="suggest" id="d-suggest" role="listbox" aria-label="Title suggestions" hidden></div>'+
          '</div>'+
          '<input id="d-author" class="d-author-input" value="'+esc(b.author||"")+'" placeholder="Add author" aria-label="Author" autocomplete="off">'+
          '<label class="d-date-lab">Finished on'+
            '<input type="date" id="d-date" class="d-date-input" value="'+esc(b.finishedOn||"")+'" max="'+isoToday()+'">'+
          '</label>'+
        '</div>'+
        (unfiled
          ? '<div class="detail-stamp stamp-unfiled" data-tier="unfiled"><span class="rank">unfiled</span></div>'
          : '<div class="detail-stamp" data-tier="'+b.tier+'"><span class="num">'+score+'</span>'+
            '<span class="rank">#'+rank+' of '+totalBooks()+'</span></div>')+
      '</div>'+
      (unfiled
        ? '<div class="filed">Read, but <b>not yet filed</b>'+
          ' <button type="button" class="inline-act" id="d-rerank">File this book</button></div>'
        : '<div class="filed">Filed under <b>'+TIER_META[b.tier].label+'</b>'+
          ' <button type="button" class="inline-act" id="d-rerank">Re-rank</button></div>')+
      '<label class="fld"><span>A line to remember it by</span>'+
        '<textarea id="d-take" rows="3" placeholder="add a thought or favorite quote">'+esc(b.takeaway||"")+'</textarea></label>'+
      '<div class="gsection"><span class="gsection-lab">Genres (up to '+MAX_GENRES+')</span><div id="genreBox"></div></div>'+
      '<div class="row detail-actions">'+
        '<button type="button" class="removelink" id="d-remove">Remove from catalog</button>'+
        '<span class="detail-actions-main">'+
          '<button class="btn ghost" id="d-close">Close</button>'+
          '<button class="btn primary" id="d-save">Save</button>'+
        '</span>'+
      '</div>';
    renderGenreBox();
    wireTitleLookup({ title:document.getElementById("d-title"), author:document.getElementById("d-author"), box:document.getElementById("d-suggest") }); // v2: lookup on title edit too
    document.getElementById("d-close").onclick = closeModal;
    document.getElementById("d-rerank").onclick = ()=>{
      const rb = store.books[id];
      // Start the placement flow for this existing book; nothing is changed in the
      // store until the user finishes, so cancelling leaves the book exactly as it was.
      flow = { mode:"add", step:"tier", reId:id, tier:null,
               title:rb.title, author:rb.author, takeaway:rb.takeaway };
      renderFlow();
    };
    document.getElementById("d-save").onclick = ()=>{
      const titleEl = document.getElementById("d-title");
      const t = titleEl.value.trim();
      if(!t){ titleEl.focus(); titleEl.style.borderBottom = "1px solid var(--stamp)"; return; } // title required
      store.books[id].title = t;
      store.books[id].author = document.getElementById("d-author").value.trim();
      store.books[id].takeaway = document.getElementById("d-take").value.trim();
      const fin = document.getElementById("d-date").value; // "" if the reader cleared it
      store.books[id].finishedOn = fin;
      store.books[id].dateFinished = displayFromIso(fin);  // keep the display string in step
      store.books[id].genres = flow.genres.slice();
      save(); const hl=id; closeModal(); render(hl);
    };
    document.getElementById("d-remove").onclick = ()=>{
      const btn = document.getElementById("d-remove");
      if(btn.dataset.armed){
        const t = b.tier;
        if(t && store.rankings[t]) store.rankings[t] = store.rankings[t].filter(x=>x!==id);
        if(Array.isArray(store.unranked)) store.unranked = store.unranked.filter(x=>x!==id);
        delete store.books[id];
        save(); closeModal(); render();
      }else{
        btn.dataset.armed = "1";
        btn.textContent = "Really remove?";
        btn.classList.add("armed");
      }
    };
  }

  // ---- Backup & restore (export / import) ----
  // The whole catalog is a small JSON object, so a backup is just that object
  // written to a file the user can save and re-load later. No server involved.
  function doExport(){
    const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
    const a = document.createElement("a");
    a.href = url; a.download = "the-stacks-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Check an imported object looks like a real Stacks backup.
  // Basic shape first, then a deeper integrity pass: every id listed in
  // rankings must have a matching entry in books (no "dangling" pointers
  // that would crash the render). Returns {ok, count} or {ok:false, reason}.
  function validateImport(data){
    if(typeof data!=="object" || data===null || Array.isArray(data))
      return { ok:false, reason:'This isn\'t a Stacks backup — it should be one object containing "books" and "rankings".' };
    if(typeof data.books!=="object" || data.books===null || Array.isArray(data.books))
      return { ok:false, reason:'The file is missing a valid "books" section.' };
    if(typeof data.rankings!=="object" || data.rankings===null || Array.isArray(data.rankings))
      return { ok:false, reason:'The file is missing a valid "rankings" section.' };
    for(const t of TIERS){
      if(!Array.isArray(data.rankings[t]))
        return { ok:false, reason:'The "rankings" section is missing the "'+t+'" list.' };
    }
    for(const t of TIERS){
      for(const id of data.rankings[t]){
        if(typeof id!=="string" || !data.books[id])
          return { ok:false, reason:'The file is damaged: a ranked book ("'+id+'") has no matching entry in "books".' };
      }
    }
    // "unranked" is optional: backups made before the holding area existed won't
    // have it. If it's there it must be sound, so a damaged file can't slip through.
    if(data.unranked !== undefined){
      if(!Array.isArray(data.unranked))
        return { ok:false, reason:'The "unranked" section should be a list of books waiting to be filed.' };
      for(const id of data.unranked){
        if(typeof id!=="string" || !data.books[id])
          return { ok:false, reason:'The file is damaged: an unfiled book ("'+id+'") has no matching entry in "books".' };
      }
    }
    const count = TIERS.reduce((a,t)=>a+data.rankings[t].length,0);
    return { ok:true, count, unfiled: Array.isArray(data.unranked) ? data.unranked.length : 0 };
  }

      const res = validateImport(data);

  // ---- Goodreads import ----------------------------------------------------
  // Goodreads retired its public API (no new keys since 2020), so the only
  // sanctioned route is the CSV a reader exports themselves. Everything here runs
  // in the browser — the file is never uploaded anywhere.

  // Minimal RFC-4180 reader: quoted fields, commas AND newlines inside quotes,
  // and doubled "" escapes. Written by hand because splitting on commas corrupts
  // any review containing one, which is common.
  function parseCsvRows(text){
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip UTF-8 BOM
    const rows = []; let row = [], field = "", inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false;
        } else field += ch;
        continue;
      }
      if(ch === '"'){ inQuotes = true; continue; }
      if(ch === ','){ row.push(field); field = ""; continue; }
      if(ch === '\r') continue;                       // CRLF handled on the \n
      if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; continue; }
      field += ch;
    }
    if(field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function parseCsv(text){
    const rows = parseCsvRows(text)
      .filter(r => r.length && !(r.length === 1 && r[0].trim() === ""));
    if(!rows.length) return { headers:[], records:[] };
    const headers = rows[0].map(h => h.trim());
    const records = rows.slice(1).map(r=>{
      const o = {};
      headers.forEach((h,i)=> o[h] = (r[i] === undefined ? "" : r[i]));
      return o;
    });
    return { headers, records };
  }

  const GR_REQUIRED = ["Title","Author","My Rating","Exclusive Shelf"];

  // Goodreads writes "2026/08/18"; we store "2026-08-18". Blank stays blank —
  // a missing date is left missing rather than invented.
  function grDateToIso(s){
    const m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/.exec((s||"").trim());
    return m ? m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0") : "";
  }

  // Ratings arrive as "5.0", not "5", so parse as a number. 0 means unrated.
  function grTier(rating){
    const n = parseFloat(rating);
    if(!isFinite(n) || n <= 0) return null;
    if(n >= 4) return "loved";
    if(n >= 3) return "fine";
    return "disliked";
  }

  // Same tolerance as the genre matcher, so "Six of Crows" in two editions collapses.
  function bookKey(title, author){ return gkey(title) + "|" + gkey(author); }

  // Goodreads stores reviews as HTML, so a line break arrives as the literal text
  // "<br/>". Convert that to real text HERE, at import. Rendering still escapes
  // everything (see esc()) — markup from a file is never injected into the page.
  function grHtmlToText(s){
    if(!s) return "";
    return String(s)
      .replace(/<br\s*\/?>/gi, "\n")      // the common case
      .replace(/<\/p\s*>/gi, "\n\n")
      .replace(/<[^>]+>/g, "")            // drop any other markup, keep its text
      .replace(/&nbsp;/gi, " ")
      .replace(/&quot;/gi, '"')
      .replace(/&#0?39;|&apos;/gi, "'")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&amp;/gi, "&")            // last, so "&amp;lt;" stays literal
      .trim();
  }

  function planGoodreadsImport(records){
    const plan = { add:[], total:records.length, notRead:0, unrated:[], dupeInFile:0, alreadyHere:0 };
    const existing = new Set();
    Object.keys(store.books).forEach(id=>{
      const b = store.books[id];
      existing.add(bookKey(b.title, b.author));
    });
    const seen = new Set();
    records.forEach(r=>{
      if((r["Exclusive Shelf"]||"").trim().toLowerCase() !== "read"){ plan.notRead++; return; }
      const title = (r["Title"]||"").trim();
      if(!title) return;
      const author = (r["Author"]||"").trim();
      const tier = grTier(r["My Rating"]);
      const key = bookKey(title, author);
      if(seen.has(key)){ plan.dupeInFile++; return; }
      seen.add(key);
      if(existing.has(key)){ plan.alreadyHere++; return; }
      if(!tier){
        // Read but never rated. Plenty of readers rate nothing at all, so these go
        // to the holding area rather than being dropped or given a made-up tier.
        plan.unrated.push({
          title, author,
          takeaway: grHtmlToText(r["My Review"]),
          finishedOn: grDateToIso(r["Date Read"]),
          addedOn: grDateToIso(r["Date Added"])
        });
        return;
      }
      plan.add.push({
        title, author,
        takeaway: grHtmlToText(r["My Review"]),        // kept whole; notes have no limit
        tier,
        finishedOn: grDateToIso(r["Date Read"]),       // often blank on Goodreads
        addedOn: grDateToIso(r["Date Added"]),         // when it was shelved there
        rating: parseFloat(r["My Rating"]) || 0
      });
    });
    return plan;
  }

  // Provisional order inside a tier: best rating first, then most recently
  // finished, then A-Z so the result is stable rather than arbitrary.
  function orderForTier(list){
    return list.slice().sort((a,b)=>{
      if(b.rating !== a.rating) return b.rating - a.rating;
      const fa = a.finishedOn || "", fb = b.finishedOn || "";
      if(fa !== fb) return fa < fb ? 1 : -1;
      return a.title.localeCompare(b.title, undefined, {sensitivity:"base"});
    });
  }

  function applyGoodreadsImport(plan, includeUnrated){
    let n = 0;
    if(includeUnrated && plan.unrated.length){
      if(!Array.isArray(store.unranked)) store.unranked = [];
      plan.unrated.forEach(entry=>{
        const id = "u" + Date.now().toString(36) + (n++).toString(36) +
                   Math.floor(Math.random()*1e4).toString(36);
        store.books[id] = {
          id, title:entry.title, author:entry.author, takeaway:entry.takeaway,
          tier: null, genres: [],                 // no tier: no opinion given yet
          finishedOn: entry.finishedOn,
          dateFinished: displayFromIso(entry.finishedOn),
          addedOn: entry.addedOn || isoToday()
        };
        store.unranked.push(id);
      });
    }
    TIERS.forEach(tier=>{
      orderForTier(plan.add.filter(x => x.tier === tier)).forEach(entry=>{
        const id = "g" + Date.now().toString(36) + (n++).toString(36) +
                   Math.floor(Math.random()*1e4).toString(36);
        store.books[id] = {
          id, title:entry.title, author:entry.author, takeaway:entry.takeaway,
          tier, genres: [],
          finishedOn: entry.finishedOn,
          dateFinished: displayFromIso(entry.finishedOn),
          addedOn: entry.addedOn || isoToday(),
          // Placed by star rating, not by you. Cleared the moment it's re-ranked.
          provisional: true
        };
        store.rankings[tier].push(id);  // below everything already ranked by hand
      });
    });
    save();
  }

  function goodreadsSummary(plan){
    const byTier = t => plan.add.filter(x => x.tier === t).length;
    const noDate = plan.add.filter(x => !x.finishedOn).length;
    const skips = [];
    if(plan.notRead)     skips.push(plan.notRead + " not marked read on Goodreads");
    if(plan.alreadyHere) skips.push(plan.alreadyHere + " already in your stacks");
    if(plan.dupeInFile)  skips.push(plan.dupeInFile + " repeated in the file");
    return { byTier, noDate, skips };
  }

      '<p class="modal-copy soft" id="un-msg">Letters, numbers and underscores. You can change it later.</p>'+
      '<div class="row">'+
        '<button class="btn ghost" id="un-out">Sign out</button>'+
        '<button class="btn primary" id="un-save">Save</button>'+
      '</div>';
    const input = document.getElementById("un-input");
    const msg = document.getElementById("un-msg");
    document.getElementById("un-out").onclick = ()=>{ closeModal(); signOut(); };
    const save = async ()=>{
      const v = input.value.trim();
      const problem = usernameProblem(v);
      if(problem){ msg.textContent = problem; input.focus(); return; }
      const btn = document.getElementById("un-save");
      btn.disabled = true; btn.textContent = "Saving…";
      const { error } = await sb.from("profiles").insert({ id: account.user.id, username: v });
      if(error){
        btn.disabled = false; btn.textContent = "Save";
        // 23505 = already taken (unique index); 23514 = the database's own format/reserved check.
        msg.textContent = error.code === "23505" ? "That one's taken — try another."
                        : error.code === "23514" ? "That name isn't allowed — try another."
                        : "Couldn't save that. Try again.";
        input.focus();
        return;
      }
      account.username = v;
      renderAccountBar();
      closeModal();
    };
    document.getElementById("un-save").onclick = save;
    input.onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } };
    openModal(); input.focus();
  }

  async function loadProfile(){
    if(!account.user) return;
    const { data, error } = await sb.from("profiles").select("username").eq("id", account.user.id).maybeSingle();
    account.username = (!error && data) ? data.username : null;
    renderAccountBar();
    if(!account.username) openUsername();
  }

  async function signOut(){
    if(sb) await sb.auth.signOut();
    account.user = null; account.username = null;
    renderAccountBar();
  }

  async function initAccount(){
    renderAccountBar();
    if(!sb) return;
    const { data } = await sb.auth.getSession();
    account.user = (data && data.session) ? data.session.user : null;
    renderAccountBar();
    if(account.user) loadProfile();
    sb.auth.onAuthStateChange((event, session)=>{
      const before = account.user && account.user.id;
      account.user = session ? session.user : null;
      if(!account.user){ account.username = null; renderAccountBar(); return; }
      // The magic link lands with its tokens in the address bar; tidy them away once used.
      if(event === "SIGNED_IN" && location.hash) history.replaceState(null, "", location.pathname + location.search);
      if(account.user.id !== before) loadProfile(); else renderAccountBar();
    });
  }

  // ---- Findability controls wiring ----
  document.getElementById("q").addEventListener("input", e=>{ view.query = e.target.value; render(); });
  document.getElementById("sortSel").addEventListener("change", e=>{ view.sort = e.target.value; render(); });
  document.getElementById("tierChips").addEventListener("click", e=>{
    const chip = e.target.closest(".chip[data-tier]"); // excludes the genre chip
    if(!chip) return;
    view.tier = (view.tier === chip.dataset.tier) ? "all" : chip.dataset.tier; // click again to clear
    render();
  });
  document.getElementById("needsChip").addEventListener("click", ()=>{
    view.needsRanking = !view.needsRanking; render();
  });
  document.getElementById("genreChip").addEventListener("click", e=>{ e.stopPropagation(); toggleGenrePop(); });
  document.addEventListener("click", e=>{ if(!e.target.closest("#genreFilter")) closeGenrePop(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeGenrePop(); });

  render();
  initAccount();
})();
</script>
</body>
</html>
