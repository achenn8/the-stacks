<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#2E3A33; --desk-edge:#25302A;
    --card:#EFE7D5; --card-2:#E7DDC7; --card-edge:#DBD0B6;
    --ink:#2A2521; --ink-soft:#6E6455; --ink-faint:#93897A;
    --rule:#B4574A; --stamp:#9C4436;
    --gold:#96762B; --sage:#556B62; --brick:#8F5A48;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--desk);
    color:var(--ink);
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 20px 80px;
  }
  ::selection{background:var(--stamp);color:var(--card)}

  /* ---- Masthead ---- */
  .masthead{
    max-width:820px; margin:0 auto; padding:40px 0 24px;
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:20px;
    border-bottom:1px solid rgba(239,231,213,.16);
  }
  .brand{flex:1 1 auto; min-width:220px}
  .brand h1{
    font-family:"Bitter",serif; font-weight:700; color:var(--card);
    font-size:38px; line-height:1; letter-spacing:-.5px; margin:0;
  }
  .brand p{
    color:rgba(239,231,213,.62); font-size:13px; margin:10px 0 0; max-width:42ch;
  }
  .count{
    color:rgba(239,231,213,.5); font-size:12px; text-transform:uppercase;
    letter-spacing:1.5px; white-space:nowrap;
  }
  .add-btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:14px;
    background:var(--card); color:var(--ink); border:none; cursor:pointer;
    padding:12px 20px; border-radius:var(--radius); letter-spacing:.3px;
    box-shadow:0 2px 0 var(--desk-edge);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .add-btn:hover{transform:translateY(-1px); box-shadow:0 3px 0 var(--desk-edge)}
  .add-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--desk-edge)}

  /* ---- Shelf / drawers ---- */
  .shelf{max-width:820px; margin:0 auto; padding-top:36px}
  .drawer{margin-bottom:36px}
  .drawer-label{
    display:inline-flex; align-items:baseline; gap:10px;
    background:var(--card-2); color:var(--ink);
    padding:6px 14px 5px; border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:2px solid var(--tier);
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px;
  }
  .drawer-label .n{color:var(--ink-soft); font-weight:400; letter-spacing:1px}
  .drawer[data-tier="loved"]{--tier:var(--gold)}
  .drawer[data-tier="fine"]{--tier:var(--sage)}
  .drawer[data-tier="disliked"]{--tier:var(--brick)}

  /* ---- Card ---- */
  .card{
    position:relative; background:var(--card);
    border:1px solid var(--card-edge); border-left:5px solid var(--tier);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:16px 18px 14px 20px; margin-top:10px; cursor:pointer;
    display:grid; grid-template-columns:1fr auto; gap:6px 20px;
    box-shadow:0 1px 0 rgba(0,0,0,.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .card:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .card .title{
    font-family:"Bitter",serif; font-weight:500; font-size:19px;
    line-height:1.25; color:var(--ink); margin:0; align-self:center;
  }
  .card .meta{
    grid-column:1; font-size:12px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.8px; margin-top:2px;
  }
  .card .note{
    grid-column:1/-1; font-family:"Bitter",serif; font-style:italic;
    font-size:14px; color:var(--ink-soft); line-height:1.4;
    border-top:1px dashed var(--card-edge); padding-top:8px; margin-top:4px;
  }
  /* call-number stamp */
  .stamp{
    grid-row:1/span 2; grid-column:2; align-self:start;
    text-align:center; min-width:64px;
  }
  .stamp .num{
    font-weight:700; font-size:26px; color:var(--stamp);
    border:2px solid var(--stamp); border-radius:var(--radius);
    padding:2px 8px; line-height:1.1; display:inline-block;
    letter-spacing:.5px;
  }
  .stamp .rank{
    display:block; font-size:11px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:1px; margin-top:6px;
  }
  @keyframes flash{0%{background:#FBF3D9}100%{background:var(--card)}}
  .card.just-filed{animation:flash 1.6s ease-out}

  /* ---- Empty state ---- */
  .empty{
    max-width:520px; margin:64px auto; text-align:center; color:rgba(239,231,213,.7);
  }
  .empty h2{font-family:"Bitter",serif; color:var(--card); font-weight:500; font-size:22px; margin:0 0 12px}
  .empty p{font-size:14px; line-height:1.6; margin:0 auto 24px; max-width:44ch}

  /* ---- Modal ---- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,26,22,.72);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:50;
  }
  .scrim.open{display:flex}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .sheet{
    background:var(--card); color:var(--ink); width:100%; max-width:560px;
    border-radius:var(--radius); padding:28px 28px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.4); animation:rise .18s ease-out;
    border-top:6px solid var(--stamp);
  }
  .sheet h2{
    font-family:"Bitter",serif; font-weight:500; font-size:23px; margin:0 0 4px; color:var(--ink);
  }
  .step-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--ink-faint);
    margin:0 0 18px;
  }
  label.fld{display:block; margin-bottom:16px}
  label.fld span{
    display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .fld input, .fld textarea{
    width:100%; font-family:"Space Mono",monospace; font-size:15px; color:var(--ink);
    background:var(--card-2); border:1px solid var(--card-edge); border-radius:var(--radius);
    padding:10px 12px; resize:vertical;
  }
  .fld input:focus, .fld textarea:focus{outline:2px solid var(--stamp); outline-offset:1px; border-color:var(--stamp)}

  .row{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap}
  .btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:14px; cursor:pointer;
    padding:11px 18px; border-radius:var(--radius); border:1px solid transparent; letter-spacing:.3px;
  }
  .btn.primary{background:var(--stamp); color:var(--card)}
  .btn.primary:hover{background:#853A2D}
  .btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--card-edge)}
  .btn.ghost:hover{color:var(--ink); border-color:var(--ink-soft)}
  .btn.danger{background:transparent; color:var(--brick); border-color:var(--brick)}
  .btn.danger:hover{background:var(--brick); color:var(--card)}
  .btn:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

  /* tier choice */
  .tiers{display:grid; gap:12px; margin-top:4px}
  .tier-pick{
    text-align:left; cursor:pointer; background:var(--card-2);
    border:1px solid var(--card-edge); border-left:6px solid var(--tc);
    border-radius:var(--radius); padding:14px 16px; font-family:inherit;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .tier-pick:hover{transform:translateX(2px); box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .tier-pick:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .tier-pick b{font-family:"Bitter",serif; font-weight:500; font-size:18px; display:block; color:var(--ink)}
  .tier-pick small{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.8px}
  .tier-pick[data-t="loved"]{--tc:var(--gold)}
  .tier-pick[data-t="fine"]{--tc:var(--sage)}
  .tier-pick[data-t="disliked"]{--tc:var(--brick)}

  /* compare */
  .versus{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:6px 0 4px}
  .pick{
    cursor:pointer; text-align:center; background:var(--card-2);
    border:1px solid var(--card-edge); border-radius:var(--radius);
    padding:22px 16px; font-family:inherit; min-height:120px;
    display:flex; flex-direction:column; justify-content:center; gap:8px;
    transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .pick:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.16); border-color:var(--stamp)}
  .pick:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .pick .pt{font-family:"Bitter",serif; font-weight:500; font-size:18px; line-height:1.3; color:var(--ink)}
  .pick .pa{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.8px}
  .versus-mid{
    text-align:center; font-size:12px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:2px; margin:2px 0;
  }
  .close-x{
    grid-column:1/-1; text-align:center; margin-top:16px;
  }

  /* detail */
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
  .detail-stamp{text-align:center; min-width:70px}
  .detail-stamp .num{font-weight:700; font-size:30px; color:var(--stamp); border:2px solid var(--stamp); border-radius:var(--radius); padding:4px 10px; display:inline-block}
  .detail-stamp .rank{display:block; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:1px; margin-top:6px}
  .filed{font-size:13px; color:var(--ink-soft); margin:14px 0 20px; text-transform:uppercase; letter-spacing:1px}
  .filed b{color:var(--ink)}

  .confirm{text-align:center; padding:8px 0 4px}
  .confirm .big-stamp .num{font-weight:700; font-size:44px; color:var(--stamp); border:3px solid var(--stamp); border-radius:var(--radius); padding:6px 16px; display:inline-block}
  .confirm p{font-size:15px; color:var(--ink-soft); margin:20px auto 0; max-width:40ch; line-height:1.5}
  .confirm p b{color:var(--ink)}

  /* shared modal body copy (import confirm / error) */
  .modal-copy{font-size:15px; color:var(--ink-soft); line-height:1.55; margin:0 0 10px}
  .modal-copy.soft{font-size:14px}
  .modal-copy b{color:var(--ink)}

  /* ---- Vault (backup & restore footer) ---- */
  .vault{
    max-width:820px; margin:48px auto 0; padding-top:20px;
    border-top:1px solid rgba(239,231,213,.16);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:14px;
  }
  .vault-btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:13px;
    background:transparent; color:rgba(239,231,213,.72);
    border:1px solid rgba(239,231,213,.28); cursor:pointer;
    padding:9px 16px; border-radius:var(--radius); letter-spacing:.3px;
    transition:color .12s ease, border-color .12s ease;
  }
  .vault-btn:hover{color:var(--card); border-color:rgba(239,231,213,.6)}
  .vault-btn:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

  @media (max-width:520px){
    .brand h1{font-size:30px}
    .versus{grid-template-columns:1fr}
    .card{grid-template-columns:1fr; }
    .stamp{grid-row:auto; grid-column:1; justify-self:start; text-align:left; margin-top:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>The Stacks</h1>
      <p>Every book you've finished, filed in the order you'd actually defend.</p>
    </div>
    <div style="text-align:right">
      <div class="count" id="count">0 volumes</div>
      <button class="add-btn" id="addBtn" style="margin-top:12px">＋ Log a finished book</button>
    </div>
  </header>

  <main class="shelf" id="shelf"></main>

  <footer class="vault" aria-label="Backup and restore">
    <button class="vault-btn" id="exportBtn">Export catalog</button>
    <button class="vault-btn" id="importBtn">Import catalog</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet" id="sheet"></div>
  </div>

<script>
(function(){
  "use strict";

  // ---- Config ----
  const KEY = "the-stacks-v1";
  const TIERS = ["loved","fine","disliked"];
  const TIER_META = {
    loved:    { label:"Loved it",      band:[7.0,10.0], sub:"couldn't stop thinking about it" },
    fine:     { label:"It was fine",   band:[4.0, 6.9], sub:"read it, no regrets, no fireworks" },
    disliked: { label:"Didn't like it",band:[1.0, 3.9], sub:"a slog, or just not for me" }
  };

  // ---- State ----
  let store = load();
  let flow = null; // active add-flow or detail state

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const s = JSON.parse(raw); if(s.books && s.rankings) return s; }
    }catch(e){}
    return { books:{}, rankings:{loved:[],fine:[],disliked:[]} };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ /* storage may be blocked in a sandbox preview; runs fine as a saved file */ }
  }

  // ---- Scoring ----
  // A book's score is derived from its position within its tier's band.
  // Best in tier sits at the top of the band; the rest are spread evenly below.
  // Lone book in a tier -> top of the band (your first "loved" is a 10 until dethroned).
  // To use the band MIDPOINT for a lone book instead, swap the return for n===1.
  function scoreFor(index, n, band){
    const [lo, hi] = band;
    // if(n === 1) return (lo + hi) / 2;      // <- conservative alternative
    const s = hi - (index / n) * (hi - lo);
    return Math.round(s * 10) / 10;
  }
  function scoreOf(id){
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const i = arr.indexOf(id);
    return scoreFor(i, arr.length, TIER_META[b.tier].band);
  }

  // ---- Rendering ----
  const shelfEl = document.getElementById("shelf");
  const countEl = document.getElementById("count");

  function totalBooks(){ return TIERS.reduce((a,t)=>a+store.rankings[t].length,0); }
  function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function render(highlightId){
    const total = totalBooks();
    countEl.textContent = total + (total===1 ? " volume" : " volumes");
    shelfEl.innerHTML = "";

    if(total === 0){
      shelfEl.innerHTML =
        '<div class="empty"><h2>The drawers are empty.</h2>'+
        "<p>The first book you file becomes the baseline everything else is measured against. "+
        'Log one you\'ve recently finished to start the catalog.</p>'+
        '<button class="add-btn" id="emptyAdd">＋ Log your first book</button></div>';
      document.getElementById("emptyAdd").onclick = openAdd;
      return;
    }

    TIERS.forEach(tier=>{
      const ids = store.rankings[tier];
      if(!ids.length) return;
      const drawer = document.createElement("section");
      drawer.className = "drawer";
      drawer.dataset.tier = tier;
      drawer.innerHTML = '<div class="drawer-label">'+TIER_META[tier].label+
        ' <span class="n">'+ids.length+'</span></div>';
      ids.forEach((id,i)=>{
        drawer.appendChild(cardEl(id, tier, i, ids.length, id===highlightId));
      });
      shelfEl.appendChild(drawer);
    });
  }

  function cardEl(id, tier, index, n, highlight){
    const b = store.books[id];
    const score = scoreFor(index, n, TIER_META[tier].band).toFixed(1);
    const c = document.createElement("div");
    c.className = "card" + (highlight ? " just-filed" : "");
    c.tabIndex = 0;
    c.setAttribute("role","button");
    c.setAttribute("aria-label", b.title + ", call number " + score + ", rank " + (index+1) + " of " + n);
    const metaBits = [b.author ? esc(b.author) : "Unknown author"];
    if(b.dateFinished) metaBits.push(b.dateFinished);
    c.innerHTML =
      '<h3 class="title">'+esc(b.title)+'</h3>'+
      '<div class="stamp"><span class="num">'+score+'</span>'+
        '<span class="rank">#'+(index+1)+' of '+n+'</span></div>'+
      '<div class="meta">'+metaBits.join(" · ")+'</div>'+
      (b.takeaway ? '<div class="note">“'+esc(b.takeaway)+'”</div>' : "");
    c.onclick = ()=>openDetail(id);
    c.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(id); } };
    return c;
  }

  // ---- Modal plumbing ----
  const scrim = document.getElementById("scrim");
  const sheet = document.getElementById("sheet");
  function openModal(){ scrim.classList.add("open"); }
  function closeModal(){ scrim.classList.remove("open"); flow=null; }
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && scrim.classList.contains("open")) closeModal(); });

  // ---- Add flow ----
  function openAdd(){
    flow = { mode:"add", step:"meta", title:"", author:"", takeaway:"", tier:null };
    renderFlow(); openModal();
  }
  document.getElementById("addBtn").onclick = openAdd;

  function renderFlow(){
    if(flow.mode==="detail") return renderDetail();
    if(flow.step==="meta")    return renderMeta();
    if(flow.step==="tier")    return renderTier();
    if(flow.step==="compare") return renderCompare();
    if(flow.step==="done")    return renderDone();
  }

  function renderMeta(){
    sheet.innerHTML =
      '<h2 id="sheetTitle">Log a finished book</h2>'+
      '<p class="step-tag">Step 1 of 3 · the details</p>'+
      '<label class="fld"><span>Title</span><input id="f-title" value="'+esc(flow.title)+'" autocomplete="off"></label>'+
      '<label class="fld"><span>Author</span><input id="f-author" value="'+esc(flow.author)+'" autocomplete="off"></label>'+
      '<label class="fld"><span>A line to remember it by — optional</span>'+
        '<textarea id="f-take" rows="2" placeholder="one thought, a favorite quote, why it stuck">'+esc(flow.takeaway)+'</textarea></label>'+
      '<div class="row">'+
        '<button class="btn ghost" id="f-cancel">Cancel</button>'+
        '<button class="btn primary" id="f-next">Next</button>'+
      '</div>';
    const titleInput = document.getElementById("f-title");
    titleInput.focus();
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-next").onclick = ()=>{
      const t = titleInput.value.trim();
      if(!t){ titleInput.focus(); titleInput.style.borderColor="var(--stamp)"; return; }
      flow.title = t;
      flow.author = document.getElementById("f-author").value.trim();
      flow.takeaway = document.getElementById("f-take").value.trim();
      flow.step = "tier";
      renderFlow();
    };
  }

  function renderTier(){
    let picks = "";
    TIERS.forEach(t=>{
      const m = TIER_META[t];
      picks += '<button class="tier-pick" data-t="'+t+'"><b>'+m.label+'</b>'+
               '<small>'+m.sub+'</small></button>';
    });
    sheet.innerHTML =
      '<h2 id="sheetTitle">How did “'+esc(flow.title)+'” land?</h2>'+
      '<p class="step-tag">Step 2 of 3 · gut check first, comparison after</p>'+
      '<div class="tiers">'+picks+'</div>'+
      '<div class="row"><button class="btn ghost" id="t-back">Back</button></div>';
    document.getElementById("t-back").onclick = ()=>{ flow.step="meta"; renderFlow(); };
    sheet.querySelectorAll(".tier-pick").forEach(btn=>{
      btn.onclick = ()=>{ flow.tier = btn.dataset.t; startPlacement(); };
    });
  }

  // Begin binary-search placement within the chosen tier.
  function startPlacement(){
    const arr = store.rankings[flow.tier];
    if(arr.length === 0){ finalize(0); return; }
    flow.lo = 0; flow.hi = arr.length; flow.round = 0;
    flow.step = "compare";
    renderFlow();
  }

  function renderCompare(){
    const arr = store.rankings[flow.tier];
    // resolved?
    if(flow.lo >= flow.hi){ finalize(flow.lo); return; }
    flow.round++;
    const mid = Math.floor((flow.lo + flow.hi) / 2);
    const rival = store.books[arr[mid]];
    sheet.innerHTML =
      '<h2 id="sheetTitle">Which did you enjoy more?</h2>'+
      '<p class="step-tag">Step 3 of 3 · comparison '+flow.round+' · filed under '+TIER_META[flow.tier].label+'</p>'+
      '<div class="versus">'+
        '<button class="pick" id="p-new"><span class="pt">'+esc(flow.title)+'</span>'+
          '<span class="pa">'+(flow.author?esc(flow.author):"your new entry")+'</span></button>'+
        '<button class="pick" id="p-old"><span class="pt">'+esc(rival.title)+'</span>'+
          '<span class="pa">'+(rival.author?esc(rival.author):"already filed")+'</span></button>'+
      '</div>'+
      '<div class="row" style="justify-content:center">'+
        '<button class="btn ghost" id="p-tie">Too close to call</button>'+
      '</div>';
    document.getElementById("p-new").onclick = ()=>{ flow.hi = mid; renderFlow(); };       // new wins -> upper half
    document.getElementById("p-old").onclick = ()=>{ flow.lo = mid + 1; renderFlow(); };    // rival wins -> lower half
    document.getElementById("p-tie").onclick = ()=>{ finalize(mid + 1); };                  // tie -> sit just below rival
  }

  function finalize(index){
    const id = "b" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
    store.books[id] = {
      id, title:flow.title, author:flow.author, takeaway:flow.takeaway,
      tier:flow.tier, dateFinished: new Date().toLocaleDateString("en-US",{month:"short",year:"numeric"})
    };
    const arr = store.rankings[flow.tier];
    const clamped = Math.max(0, Math.min(index, arr.length));
    arr.splice(clamped, 0, id);
    save();
    flow = { mode:"add", step:"done", placedId:id };
    renderFlow();
  }

  function renderDone(){
    const id = flow.placedId;
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const rank = arr.indexOf(id) + 1;
    const score = scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<div class="confirm">'+
        '<div class="big-stamp"><span class="num">'+score+'</span></div>'+
        '<p>Filed <b>“'+esc(b.title)+'”</b> under <b>'+TIER_META[b.tier].label+'</b>, '+
        'ranked <b>#'+rank+' of '+arr.length+'</b> in that drawer.<br>'+
        'Its call number moves as you file more nearby.</p>'+
      '</div>'+
      '<div class="row" style="justify-content:center; margin-top:24px">'+
        '<button class="btn ghost" id="d-again">Log another</button>'+
        '<button class="btn primary" id="d-done">Back to the stacks</button>'+
      '</div>';
    document.getElementById("d-again").onclick = openAdd;
    document.getElementById("d-done").onclick = ()=>{ const hl=id; closeModal(); render(hl); };
    render(id); // refresh shelf underneath
  }

  // ---- Detail / edit / remove ----
  function openDetail(id){
    flow = { mode:"detail", id };
    renderDetail(); openModal();
  }
  function renderDetail(){
    const id = flow.id;
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const rank = arr.indexOf(id) + 1;
    const score = scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<div class="detail-head">'+
        '<div><h2 id="sheetTitle" style="margin-bottom:2px">'+esc(b.title)+'</h2>'+
          '<div class="step-tag" style="margin:0">'+(b.author?esc(b.author):"Unknown author")+
          (b.dateFinished?' · '+b.dateFinished:"")+'</div></div>'+
        '<div class="detail-stamp"><span class="num">'+score+'</span>'+
          '<span class="rank">#'+rank+' of '+arr.length+'</span></div>'+
      '</div>'+
      '<div class="filed">Filed under <b>'+TIER_META[b.tier].label+'</b></div>'+
      '<label class="fld"><span>A line to remember it by</span>'+
        '<textarea id="d-take" rows="3" placeholder="add a thought or favorite quote">'+esc(b.takeaway||"")+'</textarea></label>'+
      '<div class="row">'+
        '<button class="btn danger" id="d-remove">Remove</button>'+
        '<button class="btn ghost" id="d-close">Close</button>'+
        '<button class="btn primary" id="d-save">Save note</button>'+
      '</div>';
    document.getElementById("d-close").onclick = closeModal;
    document.getElementById("d-save").onclick = ()=>{
      store.books[id].takeaway = document.getElementById("d-take").value.trim();
      save(); const hl=id; closeModal(); render(hl);
    };
    document.getElementById("d-remove").onclick = ()=>{
      const btn = document.getElementById("d-remove");
      if(btn.dataset.armed){
        const t = b.tier;
        store.rankings[t] = store.rankings[t].filter(x=>x!==id);
        delete store.books[id];
        save(); closeModal(); render();
      }else{
        btn.dataset.armed = "1";
        btn.textContent = "Really remove?";
      }
    };
  }

  // ---- Backup & restore (export / import) ----
  // The whole catalog is a small JSON object, so a backup is just that object
  // written to a file the user can save and re-load later. No server involved.
  function doExport(){
    const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
    const a = document.createElement("a");
    a.href = url; a.download = "the-stacks-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Check an imported object looks like a real Stacks backup.
  // Basic shape first, then a deeper integrity pass: every id listed in
  // rankings must have a matching entry in books (no "dangling" pointers
  // that would crash the render). Returns {ok, count} or {ok:false, reason}.
  function validateImport(data){
    if(typeof data!=="object" || data===null || Array.isArray(data))
      return { ok:false, reason:'This isn\'t a Stacks backup — it should be one object containing "books" and "rankings".' };
    if(typeof data.books!=="object" || data.books===null || Array.isArray(data.books))
      return { ok:false, reason:'The file is missing a valid "books" section.' };
    if(typeof data.rankings!=="object" || data.rankings===null || Array.isArray(data.rankings))
      return { ok:false, reason:'The file is missing a valid "rankings" section.' };
    for(const t of TIERS){
      if(!Array.isArray(data.rankings[t]))
        return { ok:false, reason:'The "rankings" section is missing the "'+t+'" list.' };
    }
    for(const t of TIERS){
      for(const id of data.rankings[t]){
        if(typeof id!=="string" || !data.books[id])
          return { ok:false, reason:'The file is damaged: a ranked book ("'+id+'") has no matching entry in "books".' };
      }
    }
    const count = TIERS.reduce((a,t)=>a+data.rankings[t].length,0);
    return { ok:true, count };
  }

  const importInput = document.getElementById("importFile");
  document.getElementById("exportBtn").onclick = doExport;
  document.getElementById("importBtn").onclick = ()=> importInput.click();
  importInput.onchange = ()=>{
    const file = importInput.files && importInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      importInput.value = ""; // reset so re-picking the same file fires change again
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ return showImportError("That file isn't valid JSON, so it can't be a Stacks backup."); }
      const res = validateImport(data);
      if(!res.ok) return showImportError(res.reason);
      confirmImport(data, res.count);
    };
    reader.onerror = ()=>{ importInput.value=""; showImportError("The file couldn't be read. Try exporting a fresh backup and importing that."); };
    reader.readAsText(file);
  };

  function showImportError(msg){
    flow = null;
    sheet.innerHTML =
      '<h2 id="sheetTitle">That didn\'t look like a backup</h2>'+
      '<p class="step-tag">Nothing was changed</p>'+
      '<p class="modal-copy">'+esc(msg)+'</p>'+
      '<p class="modal-copy soft">A backup is the ".json" file this app makes when you choose <b>Export catalog</b>.</p>'+
      '<div class="row"><button class="btn primary" id="ie-ok">OK</button></div>';
    document.getElementById("ie-ok").onclick = closeModal;
    openModal();
    document.getElementById("ie-ok").focus();
  }

  function confirmImport(data, count){
    flow = null;
    const current = totalBooks();
    sheet.innerHTML =
      '<h2 id="sheetTitle">Replace your catalog?</h2>'+
      '<p class="step-tag">This overwrites what\'s in the app now</p>'+
      '<p class="modal-copy">Importing replaces your current catalog of <b>'+current+'</b> '+
        (current===1?'book':'books')+' with <b>'+count+'</b> '+(count===1?'book':'books')+' from the file.</p>'+
      '<p class="modal-copy soft">If you might want your current list back, cancel and export it first.</p>'+
      '<div class="row">'+
        '<button class="btn ghost" id="ic-cancel">Cancel</button>'+
        '<button class="btn primary" id="ic-confirm">Replace catalog</button>'+
      '</div>';
    document.getElementById("ic-cancel").onclick = closeModal;
    document.getElementById("ic-confirm").onclick = ()=>{
      store = data; save(); closeModal(); render();
    };
    openModal();
    document.getElementById("ic-cancel").focus();
  }

  render();
})();
</script>
</body>
</html>
