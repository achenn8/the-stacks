<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#2E3A33; --desk-edge:#25302A;
    --card:#EFE7D5; --card-2:#E7DDC7; --card-edge:#DBD0B6;
    --ink:#2A2521; --ink-soft:#6E6455; --ink-faint:#93897A;
    --rule:#B4574A; --stamp:#9C4436;
    --gold:#96762B; --sage:#556B62; --brick:#8F5A48;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--desk);
    color:var(--ink);
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 20px 80px;
  }
  ::selection{background:var(--stamp);color:var(--card)}

  /* ---- Masthead ---- */
  .masthead{
    max-width:820px; margin:0 auto; padding:40px 0 24px;
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:20px;
    border-bottom:1px solid rgba(239,231,213,.16);
  }
  .brand{flex:1 1 auto; min-width:220px}
  .brand h1{
    font-family:"Bitter",serif; font-weight:700; color:var(--card);
    font-size:38px; line-height:1; letter-spacing:-.5px; margin:0;
  }
  .brand p{
    color:rgba(239,231,213,.62); font-size:13px; margin:10px 0 0; max-width:42ch;
  }
  .count{
    color:rgba(239,231,213,.5); font-size:12px; text-transform:uppercase;
    letter-spacing:1.5px; white-space:nowrap;
  }
  .add-btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:14px;
    background:var(--card); color:var(--ink); border:none; cursor:pointer;
    padding:12px 20px; border-radius:var(--radius); letter-spacing:.3px;
    box-shadow:0 2px 0 var(--desk-edge);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .add-btn:hover{transform:translateY(-1px); box-shadow:0 3px 0 var(--desk-edge)}
  .add-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--desk-edge)}
  .top-actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; margin-top:12px}
  .ghost-top{
    font-family:"Space Mono",monospace; font-weight:700; font-size:14px;
    background:transparent; color:rgba(239,231,213,.85);
    border:1px solid rgba(239,231,213,.35); cursor:pointer;
    padding:12px 20px; border-radius:var(--radius); letter-spacing:.3px;
    transition:color .12s ease, border-color .12s ease;
  }
  .ghost-top:hover{color:var(--card); border-color:rgba(239,231,213,.7)}
  .ghost-top:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

  /* ---- Shelf / drawers ---- */
  .shelf{max-width:820px; margin:0 auto; padding-top:36px}
  .drawer{margin-bottom:36px}
  .drawer-label{
    display:inline-flex; align-items:baseline; gap:10px;
    background:var(--card-2); color:var(--ink);
    padding:6px 14px 5px; border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:2px solid var(--tier);
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px;
  }
  .drawer-label .n{color:var(--ink-soft); font-weight:400; letter-spacing:1px}
  .drawer[data-tier="loved"]{--tier:var(--gold)}
  .drawer[data-tier="fine"]{--tier:var(--sage)}
  .drawer[data-tier="disliked"]{--tier:var(--brick)}

  /* ---- Card ---- */
  .card{
    position:relative; background:var(--card);
    border:1px solid var(--card-edge); border-left:5px solid var(--tier);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:16px 18px 14px 20px; margin-top:10px; cursor:pointer;
    display:grid; grid-template-columns:1fr auto; gap:6px 20px;
    box-shadow:0 1px 0 rgba(0,0,0,.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .card:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .card .title{
    font-family:"Bitter",serif; font-weight:500; font-size:19px;
    line-height:1.25; color:var(--ink); margin:0; align-self:center;
  }
  .card .meta{
    grid-column:1; font-size:12px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.8px; margin-top:2px;
  }
  .card .note{
    grid-column:1/-1; font-family:"Bitter",serif; font-style:italic;
    font-size:14px; color:var(--ink-soft); line-height:1.4;
    border-top:1px dashed var(--card-edge); padding-top:8px; margin-top:4px;
  }
  /* call-number stamp */
  .stamp{
    grid-row:1/span 2; grid-column:2; align-self:start;
    text-align:center; min-width:64px;
  }
  .stamp .num{
    font-weight:700; font-size:26px; color:var(--stamp);
    border:2px solid var(--stamp); border-radius:var(--radius);
    padding:2px 8px; line-height:1.1; display:inline-block;
    letter-spacing:.5px;
  }
  .stamp .rank{
    display:block; font-size:11px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:1px; margin-top:6px;
  }
  @keyframes flash{0%{background:#FBF3D9}100%{background:var(--card)}}
  .card.just-filed{animation:flash 1.6s ease-out}

  /* ---- Empty state ---- */
  .empty{
    max-width:520px; margin:64px auto; text-align:center; color:rgba(239,231,213,.7);
  }
  .empty h2{font-family:"Bitter",serif; color:var(--card); font-weight:500; font-size:22px; margin:0 0 12px}
  .empty p{font-size:14px; line-height:1.6; margin:0 auto 24px; max-width:44ch}

  /* ---- Modal ---- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,26,22,.72);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:50;
  }
  .scrim.open{display:flex}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .sheet{
    background:var(--card); color:var(--ink); width:100%; max-width:560px;
    border-radius:var(--radius); padding:28px 28px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.4); animation:rise .18s ease-out;
    border-top:6px solid var(--stamp);
  }
  .sheet h2{
    font-family:"Bitter",serif; font-weight:500; font-size:23px; margin:0 0 4px; color:var(--ink);
  }
  .step-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--ink-faint);
    margin:0 0 18px;
  }
  label.fld{display:block; margin-bottom:16px}
  label.fld span{
    display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .fld input, .fld textarea{
    width:100%; font-family:"Space Mono",monospace; font-size:15px; color:var(--ink);
    background:var(--card-2); border:1px solid var(--card-edge); border-radius:var(--radius);
    padding:10px 12px; resize:vertical;
  }
  .fld input:focus, .fld textarea:focus{outline:2px solid var(--stamp); outline-offset:1px; border-color:var(--stamp)}

  .row{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap}
  .btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:14px; cursor:pointer;
    padding:11px 18px; border-radius:var(--radius); border:1px solid transparent; letter-spacing:.3px;
  }
  .btn.primary{background:var(--stamp); color:var(--card)}
  .btn.primary:hover{background:#853A2D}
  .btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--card-edge)}
  .btn.ghost:hover{color:var(--ink); border-color:var(--ink-soft)}
  .btn:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

  /* tier choice */
  .tiers{display:grid; gap:12px; margin-top:4px}
  .tier-pick{
    text-align:left; cursor:pointer; background:var(--card-2);
    border:1px solid var(--card-edge); border-left:6px solid var(--tc);
    border-radius:var(--radius); padding:14px 16px; font-family:inherit;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .tier-pick:hover{transform:translateX(2px); box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .tier-pick:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .tier-pick b{font-family:"Bitter",serif; font-weight:500; font-size:18px; display:block; color:var(--ink)}
  .tier-pick small{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.8px}
  .tier-pick[data-t="loved"]{--tc:var(--gold)}
  .tier-pick[data-t="fine"]{--tc:var(--sage)}
  .tier-pick[data-t="disliked"]{--tc:var(--brick)}

  /* compare */
  .versus{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:6px 0 4px}
  .pick{
    cursor:pointer; text-align:center; background:var(--card-2);
    border:1px solid var(--card-edge); border-radius:var(--radius);
    padding:22px 16px; font-family:inherit; min-height:120px;
    display:flex; flex-direction:column; justify-content:center; gap:8px;
    transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .pick:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.16); border-color:var(--stamp)}
  .pick:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .pick .pt{font-family:"Bitter",serif; font-weight:500; font-size:18px; line-height:1.3; color:var(--ink)}
  .pick .pa{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.8px}
  .versus-mid{
    text-align:center; font-size:12px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:2px; margin:2px 0;
  }
  /* detail */
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
  .detail-stamp{text-align:center; min-width:70px}
  .detail-stamp .num{font-weight:700; font-size:30px; color:var(--stamp); border:2px solid var(--stamp); border-radius:var(--radius); padding:4px 10px; display:inline-block}
  .detail-stamp .rank{display:block; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:1px; margin-top:6px}
  .filed{font-size:13px; color:var(--ink-soft); margin:14px 0 20px; text-transform:uppercase; letter-spacing:1px}
  .filed b{color:var(--ink)}
  /* editable title/author in the detail header (dashed underline = editable) */
  .d-title-input{
    font-family:"Bitter",serif; font-weight:500; font-size:23px; color:var(--ink);
    background:transparent; border:none; border-bottom:1px dashed var(--card-edge);
    width:100%; padding:2px 0; margin:0;
  }
  .d-author-input{
    font-family:"Space Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink-soft); background:transparent; border:none; border-bottom:1px dashed var(--card-edge);
    width:100%; padding:3px 0; margin-top:6px;
  }
  .d-author-input::placeholder{color:var(--ink-faint)}
  .d-title-input:focus-visible, .d-author-input:focus-visible{outline:2px solid var(--stamp); outline-offset:3px; border-bottom-color:transparent}
  .d-date{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-faint); margin-top:6px}
  /* inline "Re-rank" action on the Filed line */
  .inline-act{
    font-family:"Space Mono",monospace; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:1px; cursor:pointer;
    background:transparent; color:var(--stamp); border:none;
    padding:0 0 0 8px; margin-left:8px; border-left:1px solid var(--card-edge);
  }
  .inline-act:hover{text-decoration:underline}
  .inline-act:focus-visible{outline:2px solid var(--stamp); outline-offset:2px; border-radius:2px}
  .tier-cur{font-weight:400; font-size:12px; color:var(--ink-faint); letter-spacing:.5px}
  /* de-emphasized, separated Remove control in the detail view */
  .detail-actions{justify-content:space-between; align-items:center}
  .detail-actions-main{display:flex; gap:10px; flex-wrap:wrap}
  .removelink{
    font-family:"Space Mono",monospace; font-size:13px; font-weight:700; letter-spacing:.3px;
    cursor:pointer; background:transparent; border:none; padding:6px 2px; color:var(--ink-faint);
  }
  .removelink:hover{color:var(--brick); text-decoration:underline}
  .removelink:focus-visible{outline:2px solid var(--stamp); outline-offset:2px; border-radius:2px}
  .removelink.armed{color:var(--brick); text-decoration:underline}

  .confirm{text-align:center; padding:8px 0 4px}
  .confirm .big-stamp .num{font-weight:700; font-size:44px; color:var(--stamp); border:3px solid var(--stamp); border-radius:var(--radius); padding:6px 16px; display:inline-block}
  .confirm p{font-size:15px; color:var(--ink-soft); margin:20px auto 0; max-width:40ch; line-height:1.5}
  .confirm p b{color:var(--ink)}

  /* shared modal body copy (import confirm / error) */
  .modal-copy{font-size:15px; color:var(--ink-soft); line-height:1.55; margin:0 0 10px}
  .modal-copy.soft{font-size:14px}
  .modal-copy b{color:var(--ink)}

  /* ---- Vault (backup & restore footer) ---- */
  .vault{
    max-width:820px; margin:48px auto 0; padding-top:20px;
    border-top:1px solid rgba(239,231,213,.16);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:14px;
  }
  .vault-btn{
    font-family:"Space Mono",monospace; font-weight:700; font-size:13px;
    background:transparent; color:rgba(239,231,213,.72);
    border:1px solid rgba(239,231,213,.28); cursor:pointer;
    padding:9px 16px; border-radius:var(--radius); letter-spacing:.3px;
    transition:color .12s ease, border-color .12s ease;
  }
  .vault-btn:hover{color:var(--card); border-color:rgba(239,231,213,.6)}
  .vault-btn:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

  /* card tier stripe works with or without a drawer parent (flat sorted list) */
  .card[data-tier="loved"]{--tier:var(--gold)}
  .card[data-tier="fine"]{--tier:var(--sage)}
  .card[data-tier="disliked"]{--tier:var(--brick)}

  /* ---- Findability controls (search / sort / tier chips) ---- */
  .controls{ max-width:820px; margin:24px auto 0; display:flex; flex-direction:column; gap:14px }
  .controls-top{ display:flex; flex-wrap:wrap; gap:12px 14px; align-items:flex-end }
  .ctrl-search{
    flex:1 1 240px; min-width:0;
    font-family:"Space Mono",monospace; font-size:14px; color:var(--ink);
    background:var(--card-2); border:1px solid var(--card-edge);
    border-radius:var(--radius); padding:10px 12px;
  }
  .ctrl-search::placeholder{color:var(--ink-faint)}
  .ctrl-search:focus{outline:2px solid var(--stamp); outline-offset:1px; border-color:var(--stamp)}
  .ctrl-field{display:flex; flex-direction:column; gap:5px}
  .ctrl-lab{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:rgba(239,231,213,.5)}
  .ctrl-field select{
    font-family:"Space Mono",monospace; font-size:13px; color:var(--ink);
    background:var(--card-2); border:1px solid var(--card-edge);
    border-radius:var(--radius); padding:9px 10px; cursor:pointer;
  }
  .ctrl-field select:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  /* tappable tier filter chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    font-family:"Space Mono",monospace; font-size:12px; font-weight:700; letter-spacing:.5px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    background:transparent; color:rgba(239,231,213,.72);
    border:1px solid rgba(239,231,213,.24); border-radius:999px; padding:7px 14px;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:hover{color:var(--card); border-color:rgba(239,231,213,.5)}
  .chip:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .chip[data-tier="loved"]::before,
  .chip[data-tier="fine"]::before,
  .chip[data-tier="disliked"]::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--dot) }
  .chip[data-tier="loved"]{--dot:var(--gold)}
  .chip[data-tier="fine"]{--dot:var(--sage)}
  .chip[data-tier="disliked"]{--dot:var(--brick)}
  .chip.active{background:var(--card); color:var(--ink); border-color:var(--card)}

  /* ---- Genres (card tags + tag picker in the modal) ---- */
  .gtags{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .gtag{
    font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-soft); background:var(--card-2); border:1px solid var(--card-edge);
    border-radius:999px; padding:3px 9px;
  }
  .gsection{margin-bottom:16px}
  .gsection-lab{display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin-bottom:6px}
  .gchips{
    display:flex; flex-wrap:wrap; gap:8px;
    max-height:150px; overflow-y:auto;
    padding:10px; background:var(--card-2);
    border:1px solid var(--card-edge); border-radius:var(--radius);
  }
  .gchip{
    font-family:"Space Mono",monospace; font-size:12px; font-weight:700; letter-spacing:.3px;
    cursor:pointer; background:transparent; color:var(--ink-soft);
    border:1px solid var(--card-edge); border-radius:999px; padding:6px 12px;
    transition:background .1s ease, color .1s ease, border-color .1s ease;
  }
  .gchip:hover{border-color:var(--ink-soft); color:var(--ink)}
  .gchip.on{background:var(--stamp); color:var(--card); border-color:var(--stamp)}
  .gchip:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}
  .gchip:disabled{opacity:.4; cursor:default}
  .gchip:disabled:hover{border-color:var(--card-edge); color:var(--ink-soft)}
  .gadd{display:flex; gap:8px; margin-top:10px}
  .gadd-input{
    flex:1 1 auto; min-width:0; font-family:"Space Mono",monospace; font-size:14px; color:var(--ink);
    background:var(--card-2); border:1px solid var(--card-edge); border-radius:var(--radius); padding:9px 11px;
  }
  .gadd-input::placeholder{color:var(--ink-faint)}
  .gadd-input:focus{outline:2px solid var(--stamp); outline-offset:1px; border-color:var(--stamp)}
  .gadd-btn{flex:0 0 auto; padding:9px 16px}
  .gadd-input:disabled, .gadd-btn:disabled{opacity:.5; cursor:not-allowed}
  .ghint{font-size:12px; color:var(--ink-faint); margin-top:8px}
  .gsuggest{font-size:13px; color:var(--ink-soft); margin-top:10px; line-height:1.5}
  .glink{background:transparent; border:none; padding:0; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; color:var(--stamp); text-decoration:underline}
  .glink:hover{color:#853A2D}
  .glink.alt{color:var(--ink-soft)}
  .glink.alt:hover{color:var(--ink)}
  .glink:focus-visible{outline:2px solid var(--stamp); outline-offset:2px; border-radius:2px}

  /* ---- Insights (P3) ---- */
  .ins-lab{font-family:"Bitter",serif; font-weight:500; font-size:15px; color:var(--ink); margin:22px 0 12px; padding-top:18px; border-top:1px solid var(--card-edge)}
  .ins-lab:first-of-type{border-top:none; padding-top:0; margin-top:16px}
  .ins-row{display:flex; align-items:center; gap:12px; margin-bottom:7px}
  .ins-name{width:120px; flex:0 0 auto; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ins-name.serif{font-family:"Bitter",serif; font-size:14px}
  .ins-track{flex:1 1 auto; height:14px; background:var(--card-2); border-radius:2px; overflow:hidden}
  .ins-fill{height:100%; border-radius:2px}
  .ins-num{width:22px; flex:0 0 auto; text-align:right; font-weight:700; font-size:13px; color:var(--ink)}
  .ins-rated{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--card-2)}
  .ins-rated:last-of-type{border-bottom:none}
  .ins-rname{flex:1 1 auto; min-width:0; font-family:"Bitter",serif; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ins-stamp{flex:0 0 auto; font-weight:700; font-size:13px; color:var(--stamp); border:1.5px solid var(--stamp); border-radius:var(--radius); padding:1px 8px}
  .ins-note{font-size:12px; color:var(--ink-faint); margin:2px 0 10px}
  .ins-obs{border-top:1px dashed var(--card-edge); margin-top:20px; padding-top:16px; font-family:"Bitter",serif; font-style:italic; font-size:15px; color:var(--ink-soft); line-height:1.5}
  .ins-obs b{color:var(--ink); font-style:normal}

  @media (max-width:520px){
    .brand h1{font-size:30px}
    .versus{grid-template-columns:1fr}
    .card{grid-template-columns:1fr; }
    .stamp{grid-row:auto; grid-column:1; justify-self:start; text-align:left; margin-top:8px}
    .ctrl-search{flex-basis:100%}
    .ctrl-field{flex:1 1 auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>The Stacks</h1>
      <p>Every book you've finished, filed in the order you'd actually defend.</p>
    </div>
    <div style="text-align:right">
      <div class="count" id="count" aria-live="polite">0 volumes</div>
      <div class="top-actions">
        <button class="add-btn" id="addBtn">＋ Log a finished book</button>
        <button class="ghost-top" id="insightsBtn">Insights</button>
      </div>
    </div>
  </header>

  <section class="controls" id="controls" hidden>
    <div class="controls-top">
      <input type="search" id="q" class="ctrl-search" placeholder="Search title or author…" aria-label="Search by title or author" autocomplete="off">
      <label class="ctrl-field"><span class="ctrl-lab">Sort</span>
        <select id="sortSel" aria-label="Sort books">
          <option value="score">By score</option>
          <option value="newest">Newest finished</option>
          <option value="oldest">Oldest finished</option>
          <option value="title">Title A–Z</option>
          <option value="author">Author A–Z</option>
        </select>
      </label>
    </div>
    <div class="chips" id="tierChips" role="group" aria-label="Filter by tier">
      <button type="button" class="chip" data-tier="all">All</button>
      <button type="button" class="chip" data-tier="loved">Loved it</button>
      <button type="button" class="chip" data-tier="fine">It was fine</button>
      <button type="button" class="chip" data-tier="disliked">Didn't like it</button>
    </div>
  </section>

  <main class="shelf" id="shelf"></main>

  <footer class="vault" aria-label="Backup and restore">
    <button class="vault-btn" id="exportBtn">Export catalog</button>
    <button class="vault-btn" id="importBtn">Import catalog</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet" id="sheet"></div>
  </div>

<script>
(function(){
  "use strict";

  // ---- Config ----
  const KEY = "the-stacks-v2";       // current schema (books have genres[] + finishedOn)
  const KEY_V1 = "the-stacks-v1";    // previous schema; kept untouched on disk as a fallback
  const TIERS = ["loved","fine","disliked"];
  const TIER_META = {
    loved:    { label:"Loved it",      band:[7.0,10.0], sub:"couldn't stop thinking about it" },
    fine:     { label:"It was fine",   band:[4.0, 6.9], sub:"read it, no regrets, no fireworks" },
    disliked: { label:"Didn't like it",band:[1.0, 3.9], sub:"a slog, or just not for me" }
  };
  // Month name -> 0-based index (used by both the migration and the date sort).
  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  // Suggested genres shown as chips; the reader's own genres get added to these on the fly.
  const STARTER_GENRES = ["Literary Fiction","Fantasy","Sci-Fi","Mystery & Thriller","Romance","Horror","Poetry","Historical","Nonfiction","Memoir","Science","Philosophy"];
  const MAX_GENRES = 3; // a book can carry at most this many genres
  const INSIGHTS_MIN = 10; // books needed before the Insights view shows patterns
  const GENRE_MIN = 3;     // books a genre needs before it appears in "rated highest"

  // ---- State ----
  let store = load();
  let flow = null; // active add-flow or detail state
  // Transient search/sort/filter view. Never saved to storage; resets on reload.
  const DEFAULT_VIEW = { query:"", sort:"score", tier:"all" };
  let view = Object.assign({}, DEFAULT_VIEW);

  function emptyStore(){ return { books:{}, rankings:{loved:[],fine:[],disliked:[]} }; }
  function isValidShape(s){ return s && s.books && s.rankings; }

  // Derive a sortable "YYYY-MM-DD" from an old display date like "Jul 2026".
  // Best-effort at month precision (day defaults to 01); returns "" if unparseable.
  function isoFromDisplay(s){
    const m = (s||"").trim().toLowerCase().match(/^([a-z]{3})[a-z]*\s+(\d{4})$/);
    if(!m || !(m[1] in MONTHS)) return "";
    return m[2] + "-" + String(MONTHS[m[1]]+1).padStart(2,"0") + "-01";
  }

  // Upgrade any store to the current schema: every book gets genres[] and finishedOn.
  // Additive only — existing fields are never removed or changed. Idempotent (safe to
  // run on already-migrated data), so it also self-heals partial records.
  function migrate(s){
    if(!isValidShape(s)) return s;
    Object.keys(s.books).forEach(id=>{
      const b = s.books[id];
      if(!Array.isArray(b.genres)) b.genres = [];
      if(!b.finishedOn) b.finishedOn = isoFromDisplay(b.dateFinished);
    });
    return s;
  }

  // Load order: current v2 key first; else migrate a COPY of the old v1 data into v2
  // (leaving v1 untouched on disk as a fallback); else start empty.
  function load(){
    try{
      const rawV2 = localStorage.getItem(KEY);
      if(rawV2){ const s = JSON.parse(rawV2); if(isValidShape(s)) return migrate(s); }
    }catch(e){}
    try{
      const rawV1 = localStorage.getItem(KEY_V1);
      if(rawV1){
        const old = JSON.parse(rawV1);
        if(isValidShape(old)){
          const upgraded = migrate(old);
          try{ localStorage.setItem(KEY, JSON.stringify(upgraded)); }catch(e){}
          return upgraded; // v1 string is left in place as a fallback
        }
      }
    }catch(e){}
    return emptyStore();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ /* storage may be blocked in a sandbox preview; runs fine as a saved file */ }
  }

  // ---- Scoring ----
  // A book's score is derived from its position within its tier's band.
  // Best in tier sits at the top of the band; the rest are spread evenly below.
  // Lone book in a tier -> top of the band (your first "loved" is a 10 until dethroned).
  // To use the band MIDPOINT for a lone book instead, swap the return for n===1.
  function scoreFor(index, n, band){
    const [lo, hi] = band;
    // if(n === 1) return (lo + hi) / 2;      // <- conservative alternative
    const s = hi - (index / n) * (hi - lo);
    return Math.round(s * 10) / 10;
  }
  function scoreOf(id){
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const i = arr.indexOf(id);
    return scoreFor(i, arr.length, TIER_META[b.tier].band);
  }

  // ---- Rendering ----
  const shelfEl = document.getElementById("shelf");
  const countEl = document.getElementById("count");
  const controlsEl = document.getElementById("controls");
  const insightsBtn = document.getElementById("insightsBtn");

  function totalBooks(){ return TIERS.reduce((a,t)=>a+store.rankings[t].length,0); }
  function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // Rank/score are always derived from a book's real position in storage, by id —
  // never from where its card sits on screen. That is what makes search/sort/filter
  // view-only: reordering the display can't change any score.
  function rankInfo(id){
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const index = arr.indexOf(id);
    return { tier:b.tier, index, n:arr.length, score:scoreFor(index, arr.length, TIER_META[b.tier].band) };
  }

  function matchesQuery(b, q){
    if(!q) return true;
    q = q.toLowerCase();
    return (b.title||"").toLowerCase().includes(q) || (b.author||"").toLowerCase().includes(q);
  }

  // Sortable date for a book: prefer the precise finishedOn ("YYYY-MM-DD"), else derive
  // one from the "Mon YYYY" display string. ISO date strings compare chronologically as
  // plain text. Returns "" when there's no usable date (those sort last).
  function dateSortKey(b){
    return b.finishedOn || isoFromDisplay(b.dateFinished) || "";
  }

  // Ids passing the current tier + author + search filters, in tier/rank order.
  function visibleIds(){
    const q = view.query.trim();
    const out = [];
    TIERS.forEach(t=>{
      if(view.tier!=="all" && view.tier!==t) return;
      store.rankings[t].forEach(id=>{
        if(!matchesQuery(store.books[id], q)) return;
        out.push(id);
      });
    });
    return out;
  }

  function sortIds(ids){
    const title = id => (store.books[id].title||"");
    const author = id => (store.books[id].author||"");
    const byTitle = (a,b)=> title(a).localeCompare(title(b), undefined, {sensitivity:"base"});
    const byAuthor = (a,b)=>{
      const aa=author(a), ba=author(b);
      if(!aa && ba) return 1; if(aa && !ba) return -1;   // unknown authors last
      return aa.localeCompare(ba, undefined, {sensitivity:"base"}) || byTitle(a,b);
    };
    const arr = ids.slice();
    if(view.sort==="title")  return arr.sort((a,b)=> byTitle(a,b) || byAuthor(a,b));
    if(view.sort==="author") return arr.sort(byAuthor);
    if(view.sort==="newest" || view.sort==="oldest"){
      const dir = view.sort==="newest" ? -1 : 1;
      return arr.sort((a,b)=>{
        const ka=dateSortKey(store.books[a]), kb=dateSortKey(store.books[b]);
        if(ka===kb) return byTitle(a,b);
        if(!ka) return 1;                    // undated last, both directions
        if(!kb) return -1;
        return (ka < kb ? -1 : 1) * dir;     // ISO date strings compare chronologically
      });
    }
    return arr;
  }

  function resetView(){ view = Object.assign({}, DEFAULT_VIEW); render(); }

  // Reflect the current view state into the controls, and rebuild the author dropdown.
  function syncControls(){
    const q = document.getElementById("q");
    if(document.activeElement!==q) q.value = view.query; // don't fight the cursor while typing
    document.getElementById("sortSel").value = view.sort;
    document.querySelectorAll("#tierChips .chip").forEach(chip=>{
      const on = chip.dataset.tier === view.tier;
      chip.classList.toggle("active", on);
      chip.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function render(highlightId){
    const total = totalBooks();
    shelfEl.innerHTML = "";

    if(total === 0){
      controlsEl.hidden = true;
      insightsBtn.hidden = true;
      countEl.textContent = "0 volumes";
      shelfEl.innerHTML =
        '<div class="empty"><h2>The drawers are empty.</h2>'+
        "<p>The first book you file becomes the baseline everything else is measured against. "+
        'Log one you\'ve recently finished to start the catalog.</p>'+
        '<button class="add-btn" id="emptyAdd">＋ Log your first book</button></div>';
      document.getElementById("emptyAdd").onclick = openAdd;
      return;
    }

    controlsEl.hidden = false;
    insightsBtn.hidden = false;
    syncControls();

    const ids = visibleIds();
    countEl.textContent = (ids.length!==total)
      ? ids.length + " of " + total + (total===1?" volume":" volumes")
      : total + (total===1?" volume":" volumes");

    if(ids.length === 0){
      shelfEl.innerHTML =
        '<div class="empty"><h2>No books match your filters.</h2>'+
        '<p>Nothing fits the current search and filters. Loosen them, or clear '+
        'everything to see all '+total+' books.</p>'+
        '<button class="add-btn" id="clearFilters">Clear search &amp; filters</button></div>';
      document.getElementById("clearFilters").onclick = resetView;
      return;
    }

    if(view.sort === "score"){
      TIERS.forEach(tier=>{
        const tierIds = ids.filter(id=> store.books[id].tier===tier);
        if(!tierIds.length) return;
        const drawer = document.createElement("section");
        drawer.className = "drawer";
        drawer.dataset.tier = tier;
        drawer.innerHTML = '<div class="drawer-label">'+TIER_META[tier].label+
          ' <span class="n">'+tierIds.length+'</span></div>';
        tierIds.forEach(id=> drawer.appendChild(cardEl(id, id===highlightId)));
        shelfEl.appendChild(drawer);
      });
    } else {
      const list = document.createElement("section");
      list.className = "drawer flatlist";
      sortIds(ids).forEach(id=> list.appendChild(cardEl(id, id===highlightId)));
      shelfEl.appendChild(list);
    }
  }

  function cardEl(id, highlight){
    const b = store.books[id];
    const info = rankInfo(id);
    const score = info.score.toFixed(1);
    const c = document.createElement("div");
    c.className = "card" + (highlight ? " just-filed" : "");
    c.dataset.tier = info.tier; // sets the left-stripe color even outside a drawer
    c.tabIndex = 0;
    c.setAttribute("role","button");
    c.setAttribute("aria-label", b.title + ", " + TIER_META[info.tier].label +
      ", call number " + score + ", rank " + (info.index+1) + " of " + info.n);
    const metaBits = [b.author ? esc(b.author) : "Unknown author"];
    if(b.dateFinished) metaBits.push(b.dateFinished);
    c.innerHTML =
      '<h3 class="title">'+esc(b.title)+'</h3>'+
      '<div class="stamp"><span class="num">'+score+'</span>'+
        '<span class="rank">#'+(info.index+1)+' of '+info.n+'</span></div>'+
      '<div class="meta">'+metaBits.join(" · ")+'</div>'+
      (Array.isArray(b.genres)&&b.genres.length ? '<div class="gtags">'+b.genres.map(g=>'<span class="gtag">'+esc(g)+'</span>').join("")+'</div>' : "")+
      (b.takeaway ? '<div class="note">“'+esc(b.takeaway)+'”</div>' : "");
    c.onclick = ()=>openDetail(id);
    c.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(id); } };
    return c;
  }

  // ---- Genres (tag picker shared by the add flow and the detail view) ----
  // Match key: case-, space-, and punctuation-insensitive, so "Sci-Fi", "sci fi" and
  // "scifi" all collapse to the same genre.
  function gkey(g){ return (g||"").toLowerCase().replace(/[^a-z0-9]+/g,""); }
  function hasGenre(list, g){ const k=gkey(g); return (list||[]).some(x=> gkey(x)===k); }
  function addGenre(g){ if(flow.genres.length < MAX_GENRES && !hasGenre(flow.genres, g)) flow.genres.push(g); }
  function usedGenres(){
    const map = new Map(); // gkey -> canonical spelling actually stored
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      (store.books[id].genres||[]).forEach(g=>{ const k=gkey(g); if(!map.has(k)) map.set(k,g); });
    }));
    return [...map.values()];
  }
  function genreCounts(){
    const counts = new Map(); // gkey -> how many books use it
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      (store.books[id].genres||[]).forEach(g=>{ const k=gkey(g); counts.set(k,(counts.get(k)||0)+1); });
    }));
    return counts;
  }
  // Chip options: starter set + the reader's own genres (used or selected), deduped, then
  // ordered MOST-USED first (ties alphabetical) so frequent genres sit at the top.
  function genreOptions(selected){
    const seen = new Set(); const list = [];
    const push = g => { const k=gkey(g); if(k && !seen.has(k)){ seen.add(k); list.push(g); } };
    STARTER_GENRES.forEach(push);
    usedGenres().forEach(push);
    (selected||[]).forEach(push);
    const counts = genreCounts();
    return list.sort((a,b)=>{
      const ca=counts.get(gkey(a))||0, cb=counts.get(gkey(b))||0;
      return cb!==ca ? cb-ca : a.localeCompare(b, undefined, {sensitivity:"base"});
    });
  }
  function toggleGenre(g){
    const k=gkey(g);
    if(flow.genres.some(x=> gkey(x)===k)) flow.genres = flow.genres.filter(x=> gkey(x)!==k);
    else if(flow.genres.length < MAX_GENRES) flow.genres.push(g);   // ignore adds past the cap
  }
  // Levenshtein edit distance — how many single-character edits turn one string into another.
  function editDistance(a,b){
    const m=a.length, n=b.length;
    if(!m) return n; if(!n) return m;
    let prev=[...Array(n+1).keys()], cur=new Array(n+1);
    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      }
      const t=prev; prev=cur; cur=t;
    }
    return prev[n];
  }
  // Closest existing option to a typed genre (by normalized edit distance) — powers the
  // "did you mean?" nudge. Returns null unless something is genuinely close (a likely typo).
  function nearestGenre(typed){
    const kt=gkey(typed); if(!kt) return null;
    let best=null, bestD=Infinity;
    genreOptions(flow.genres).forEach(o=>{
      const ko=gkey(o); if(ko===kt) return;
      const d=editDistance(kt,ko);
      if(d<bestD){ bestD=d; best=o; }
    });
    const thresh = kt.length<=4 ? 1 : 2;
    return (best && bestD>0 && bestD<=thresh) ? best : null;
  }
  // Fills #genreBox from flow.genres and re-renders on any change, so a just-added custom
  // genre immediately becomes a reusable chip.
  function renderGenreBox(){
    const box = document.getElementById("genreBox");
    if(!box) return;
    const atLimit = flow.genres.length >= MAX_GENRES;
    let html = '<div class="gchips">';
    genreOptions(flow.genres).forEach(g=>{
      const on = hasGenre(flow.genres, g);
      const dis = (!on && atLimit) ? " disabled" : ""; // at the cap, only selected chips stay tappable
      html += '<button type="button" class="gchip'+(on?" on":"")+'"'+dis+' data-g="'+esc(g)+'" aria-pressed="'+(on?"true":"false")+'">'+esc(g)+'</button>';
    });
    html += '</div>'+
      (atLimit ? '<div class="ghint">'+MAX_GENRES+' genres max — remove one to add another.</div>' : '')+
      '<div class="gadd">'+
        '<input type="text" id="gInput" class="gadd-input" placeholder="'+(atLimit?"At the "+MAX_GENRES+"-genre limit":"Add your own…")+'"'+(atLimit?" disabled":"")+' aria-label="Add a custom genre" autocomplete="off">'+
        '<button type="button" class="btn ghost gadd-btn" id="gAdd"'+(atLimit?" disabled":"")+'>Add</button>'+
      '</div>'+
      (flow.gSuggest ? '<div class="gsuggest">Did you mean <button type="button" class="glink" id="gUse">'+esc(flow.gSuggest.suggestion)+'</button>?'+
        ' <button type="button" class="glink alt" id="gKeep">Add “'+esc(flow.gSuggest.typed)+'” instead</button></div>' : '');
    box.innerHTML = html;
    const focusInput = ()=>{ const gi=document.getElementById("gInput"); if(gi && !gi.disabled) gi.focus(); };
    box.querySelectorAll(".gchip").forEach(ch=>{ ch.onclick = ()=>{ flow.gSuggest=null; toggleGenre(ch.dataset.g); renderGenreBox(); }; });
    const input = document.getElementById("gInput");
    const add = ()=>{
      const g = (input.value||"").trim().replace(/\s+/g," ");
      if(!g) return;
      const exact = genreOptions(flow.genres).find(o=> gkey(o)===gkey(g)); // formatting/case variant
      if(exact){ addGenre(exact); flow.gSuggest=null; renderGenreBox(); focusInput(); return; }
      const near = nearestGenre(g);
      if(near){ flow.gSuggest = { typed:g, suggestion:near }; renderGenreBox(); return; } // suggest, don't silently merge
      addGenre(g); flow.gSuggest=null; renderGenreBox(); focusInput();
    };
    document.getElementById("gAdd").onclick = add;
    input.onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
    if(flow.gSuggest){
      document.getElementById("gUse").onclick = ()=>{ addGenre(flow.gSuggest.suggestion); flow.gSuggest=null; renderGenreBox(); focusInput(); };
      document.getElementById("gKeep").onclick = ()=>{ addGenre(flow.gSuggest.typed); flow.gSuggest=null; renderGenreBox(); focusInput(); };
    }
  }

  // ---- Insights (P3) — read-only reflection of the catalog ----
  // Per-genre { name, count, avg score }, computed from the current derived scores.
  function genreStats(){
    const m = new Map(); // gkey -> {name, count, sum}
    TIERS.forEach(t=> store.rankings[t].forEach(id=>{
      const sc = scoreOf(id);
      (store.books[id].genres||[]).forEach(g=>{
        const k = gkey(g);
        if(!m.has(k)) m.set(k, { name:g, count:0, sum:0 });
        const e = m.get(k); e.count++; e.sum += sc;
      });
    }));
    return [...m.values()].map(e=>({ name:e.name, count:e.count, avg:e.sum/e.count }));
  }
  function openInsights(){ renderInsights(); openModal(); }
  function renderInsights(){
    flow = { mode:"insights" };
    const total = totalBooks();
    if(total < INSIGHTS_MIN){
      sheet.innerHTML =
        '<h2 id="sheetTitle">Your reading in numbers</h2>'+
        '<p class="step-tag">A little more to chew on</p>'+
        '<p class="modal-copy">You’ve logged <b>'+total+'</b> '+(total===1?'book':'books')+'. About '+
        '<b>'+(INSIGHTS_MIN-total)+'</b> more and this view starts showing patterns — which tiers and '+
        'genres you gravitate to, and what you rate highest.</p>'+
        '<div class="row"><button class="btn primary" id="ins-ok">Back to the stacks</button></div>';
      document.getElementById("ins-ok").onclick = closeModal;
      return;
    }
    const barColor = { loved:"var(--gold)", fine:"var(--sage)", disliked:"var(--brick)" };
    let html =
      '<h2 id="sheetTitle">Your reading in numbers</h2>'+
      '<p class="step-tag">'+total+' volumes</p>'+
      '<div class="ins-lab">How they landed</div>';
    TIERS.forEach(t=>{
      const n = store.rankings[t].length;
      const w = Math.round(n/total*100);
      html += '<div class="ins-row"><div class="ins-name">'+TIER_META[t].label+'</div>'+
        '<div class="ins-track"><div class="ins-fill" style="width:'+w+'%; background:'+barColor[t]+'"></div></div>'+
        '<div class="ins-num">'+n+'</div></div>';
    });

    const stats = genreStats();
    if(stats.length === 0){
      html += '<p class="modal-copy soft" style="margin-top:20px">Tag some books with genres (from a book’s page) to unlock genre insights here.</p>';
    } else {
      const byCount = stats.slice().sort((a,b)=> b.count-a.count || a.name.localeCompare(b.name));
      const cMax = byCount[0].count;
      html += '<div class="ins-lab">Genres you read most</div>';
      byCount.slice(0,5).forEach(s=>{
        const w = Math.round(s.count/cMax*100);
        html += '<div class="ins-row"><div class="ins-name serif" title="'+esc(s.name)+'">'+esc(s.name)+'</div>'+
          '<div class="ins-track"><div class="ins-fill" style="width:'+w+'%; background:var(--ink-soft)"></div></div>'+
          '<div class="ins-num">'+s.count+'</div></div>';
      });

      const rated = stats.filter(s=> s.count>=GENRE_MIN).sort((a,b)=> b.avg-a.avg || a.name.localeCompare(b.name));
      html += '<div class="ins-lab">Genres you rate highest</div>';
      if(rated.length){
        html += '<p class="ins-note">average call number · genres with '+GENRE_MIN+'+ books</p>';
        rated.slice(0,5).forEach(s=>{
          html += '<div class="ins-rated"><span class="ins-rname">'+esc(s.name)+'</span>'+
            '<span class="ins-stamp">'+s.avg.toFixed(1)+'</span></div>';
        });
      } else {
        html += '<p class="ins-note">A few more books per genre ('+GENRE_MIN+'+) and you’ll see which you rate highest.</p>';
      }

      const tagInstances = stats.reduce((a,s)=>a+s.count,0);
      const obs = [];
      if(byCount.length>=2 && tagInstances>0 && (byCount[0].count+byCount[1].count)/tagInstances >= 0.5){
        obs.push('Most of your reading sits in two genres — <b>'+esc(byCount[0].name)+'</b> and <b>'+esc(byCount[1].name)+'</b>.');
      }
      if(rated.length){
        obs.push('You rate <b>'+esc(rated[0].name)+'</b> highest on average ('+rated[0].avg.toFixed(1)+').');
      }
      if(obs.length) html += '<div class="ins-obs">'+obs.join(' ')+'</div>';
    }

    html += '<div class="row" style="margin-top:22px"><button class="btn primary" id="ins-ok">Back to the stacks</button></div>';
    sheet.innerHTML = html;
    document.getElementById("ins-ok").onclick = closeModal;
  }

  // ---- Modal plumbing ----
  const scrim = document.getElementById("scrim");
  const sheet = document.getElementById("sheet");
  function openModal(){ scrim.classList.add("open"); }
  function closeModal(){ scrim.classList.remove("open"); flow=null; }
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && scrim.classList.contains("open")) closeModal(); });

  // ---- Add flow ----
  function openAdd(){
    flow = { mode:"add", step:"meta", title:"", author:"", takeaway:"", tier:null, genres:[] };
    renderFlow(); openModal();
  }
  document.getElementById("addBtn").onclick = openAdd;

  function renderFlow(){
    if(flow.mode==="detail") return renderDetail();
    if(flow.step==="meta")    return renderMeta();
    if(flow.step==="tier")    return renderTier();
    if(flow.step==="compare") return renderCompare();
    if(flow.step==="done")    return renderDone();
  }

  function renderMeta(){
    sheet.innerHTML =
      '<h2 id="sheetTitle">Log a finished book</h2>'+
      '<p class="step-tag">Step 1 of 3 · the details</p>'+
      '<label class="fld"><span>Title</span><input id="f-title" value="'+esc(flow.title)+'" autocomplete="off"></label>'+
      '<label class="fld"><span>Author</span><input id="f-author" value="'+esc(flow.author)+'" autocomplete="off"></label>'+
      '<label class="fld"><span>A line to remember it by — optional</span>'+
        '<textarea id="f-take" rows="2" placeholder="one thought, a favorite quote, why it stuck">'+esc(flow.takeaway)+'</textarea></label>'+
      '<div class="gsection"><span class="gsection-lab">Genres — optional (up to '+MAX_GENRES+')</span><div id="genreBox"></div></div>'+
      '<div class="row">'+
        '<button class="btn ghost" id="f-cancel">Cancel</button>'+
        '<button class="btn primary" id="f-next">Next</button>'+
      '</div>';
    if(!Array.isArray(flow.genres)) flow.genres = [];
    renderGenreBox();
    const titleInput = document.getElementById("f-title");
    titleInput.focus();
    document.getElementById("f-cancel").onclick = closeModal;
    document.getElementById("f-next").onclick = ()=>{
      const t = titleInput.value.trim();
      if(!t){ titleInput.focus(); titleInput.style.borderColor="var(--stamp)"; return; }
      flow.title = t;
      flow.author = document.getElementById("f-author").value.trim();
      flow.takeaway = document.getElementById("f-take").value.trim();
      flow.step = "tier";
      renderFlow();
    };
  }

  function renderTier(){
    const reranking = !!flow.reId;
    const currentTier = reranking ? store.books[flow.reId].tier : null;
    let picks = "";
    TIERS.forEach(t=>{
      const m = TIER_META[t];
      const cur = t===currentTier ? ' <span class="tier-cur">· current</span>' : "";
      picks += '<button class="tier-pick" data-t="'+t+'"><b>'+m.label+cur+'</b>'+
               '<small>'+m.sub+'</small></button>';
    });
    sheet.innerHTML =
      '<h2 id="sheetTitle">'+(reranking
          ? 'Re-file “'+esc(flow.title)+'”'
          : 'How did “'+esc(flow.title)+'” land?')+'</h2>'+
      '<p class="step-tag">'+(reranking
          ? 'Pick a tier — keep it here or move it, then re-rank'
          : 'Step 2 of 3 · gut check first, comparison after')+'</p>'+
      '<div class="tiers">'+picks+'</div>'+
      '<div class="row"><button class="btn ghost" id="t-back">Back</button></div>';
    document.getElementById("t-back").onclick = ()=>{
      if(reranking){ openDetail(flow.reId); } else { flow.step="meta"; renderFlow(); }
    };
    sheet.querySelectorAll(".tier-pick").forEach(btn=>{
      btn.onclick = ()=>{ flow.tier = btn.dataset.t; startPlacement(); };
    });
  }

  // Begin binary-search placement within the chosen tier.
  // The comparison pool excludes the book being re-ranked (flow.reId), so a book is
  // never compared against itself. For a brand-new book, reId is undefined and the
  // filter removes nothing.
  function startPlacement(){
    flow.pool = store.rankings[flow.tier].filter(x => x !== flow.reId);
    if(flow.pool.length === 0){ finalize(0); return; }
    flow.lo = 0; flow.hi = flow.pool.length; flow.round = 0;
    flow.step = "compare";
    renderFlow();
  }

  function renderCompare(){
    const arr = flow.pool;
    // resolved?
    if(flow.lo >= flow.hi){ finalize(flow.lo); return; }
    flow.round++;
    const mid = Math.floor((flow.lo + flow.hi) / 2);
    const rival = store.books[arr[mid]];
    const tag = flow.reId
      ? 'Re-ranking · comparison '+flow.round+' · '+TIER_META[flow.tier].label
      : 'Step 3 of 3 · comparison '+flow.round+' · filed under '+TIER_META[flow.tier].label;
    const newSub = flow.author ? esc(flow.author)
                 : (flow.reId ? "the book you're re-ranking" : "your new entry");
    sheet.innerHTML =
      '<h2 id="sheetTitle">Which did you enjoy more?</h2>'+
      '<p class="step-tag">'+tag+'</p>'+
      '<div class="versus">'+
        '<button class="pick" id="p-new"><span class="pt">'+esc(flow.title)+'</span>'+
          '<span class="pa">'+newSub+'</span></button>'+
        '<button class="pick" id="p-old"><span class="pt">'+esc(rival.title)+'</span>'+
          '<span class="pa">'+(rival.author?esc(rival.author):"already filed")+'</span></button>'+
      '</div>';
    document.getElementById("p-new").onclick = ()=>{ flow.hi = mid; renderFlow(); };       // new wins -> upper half
    document.getElementById("p-old").onclick = ()=>{ flow.lo = mid + 1; renderFlow(); };    // rival wins -> lower half
  }

  function finalize(index){
    let id;
    if(flow.reId){
      // Re-rank: reuse the existing book (keeps its note/title/author/date).
      // Pull it out of its old tier list, then re-file it in the chosen tier below.
      id = flow.reId;
      const old = store.books[id].tier;
      store.rankings[old] = store.rankings[old].filter(x => x !== id);
      store.books[id].tier = flow.tier;
    } else {
      const now = new Date();
      const iso = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
      id = "b" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
      store.books[id] = {
        id, title:flow.title, author:flow.author, takeaway:flow.takeaway, tier:flow.tier,
        genres: Array.isArray(flow.genres) ? flow.genres : [],
        dateFinished: now.toLocaleDateString("en-US",{month:"short",year:"numeric"}),
        finishedOn: iso
      };
    }
    const arr = store.rankings[flow.tier];
    const clamped = Math.max(0, Math.min(index, arr.length));
    arr.splice(clamped, 0, id);
    save();
    flow = { mode:"add", step:"done", placedId:id, wasReRank: !!flow.reId };
    renderFlow();
  }

  function renderDone(){
    const id = flow.placedId;
    const wasRe = flow.wasReRank;
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const rank = arr.indexOf(id) + 1;
    const score = scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<div class="confirm">'+
        '<div class="big-stamp"><span class="num">'+score+'</span></div>'+
        '<p>'+(wasRe?"Re-filed":"Filed")+' <b>“'+esc(b.title)+'”</b> under <b>'+TIER_META[b.tier].label+'</b>, '+
        'ranked <b>#'+rank+' of '+arr.length+'</b> in that drawer.<br>'+
        'Its call number moves as you file more nearby.</p>'+
      '</div>'+
      '<div class="row" style="justify-content:center; margin-top:24px">'+
        (wasRe ? "" : '<button class="btn ghost" id="d-again">Log another</button>')+
        '<button class="btn primary" id="d-done">Back to the stacks</button>'+
      '</div>';
    if(!wasRe) document.getElementById("d-again").onclick = openAdd;
    document.getElementById("d-done").onclick = ()=>{ const hl=id; closeModal(); render(hl); };
    if(!wasRe) view = Object.assign({}, DEFAULT_VIEW); // a new book: clear filters so it's visible
    render(id); // refresh shelf underneath
  }

  // ---- Detail / edit / remove ----
  function openDetail(id){
    flow = { mode:"detail", id, genres:(store.books[id].genres||[]).slice() };
    renderDetail(); openModal();
  }
  function renderDetail(){
    const id = flow.id;
    const b = store.books[id];
    const arr = store.rankings[b.tier];
    const rank = arr.indexOf(id) + 1;
    const score = scoreOf(id).toFixed(1);
    sheet.innerHTML =
      '<h2 id="sheetTitle" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Book details</h2>'+
      '<div class="detail-head">'+
        '<div style="flex:1; min-width:0">'+
          '<input id="d-title" class="d-title-input" value="'+esc(b.title)+'" aria-label="Title" autocomplete="off">'+
          '<input id="d-author" class="d-author-input" value="'+esc(b.author||"")+'" placeholder="Add author" aria-label="Author" autocomplete="off">'+
          (b.dateFinished ? '<div class="d-date">'+esc(b.dateFinished)+'</div>' : '')+
        '</div>'+
        '<div class="detail-stamp"><span class="num">'+score+'</span>'+
          '<span class="rank">#'+rank+' of '+arr.length+'</span></div>'+
      '</div>'+
      '<div class="filed">Filed under <b>'+TIER_META[b.tier].label+'</b>'+
        ' <button type="button" class="inline-act" id="d-rerank">Re-rank</button></div>'+
      '<label class="fld"><span>A line to remember it by</span>'+
        '<textarea id="d-take" rows="3" placeholder="add a thought or favorite quote">'+esc(b.takeaway||"")+'</textarea></label>'+
      '<div class="gsection"><span class="gsection-lab">Genres (up to '+MAX_GENRES+')</span><div id="genreBox"></div></div>'+
      '<div class="row detail-actions">'+
        '<button type="button" class="removelink" id="d-remove">Remove from catalog</button>'+
        '<span class="detail-actions-main">'+
          '<button class="btn ghost" id="d-close">Close</button>'+
          '<button class="btn primary" id="d-save">Save</button>'+
        '</span>'+
      '</div>';
    renderGenreBox();
    document.getElementById("d-close").onclick = closeModal;
    document.getElementById("d-rerank").onclick = ()=>{
      const rb = store.books[id];
      // Start the placement flow for this existing book; nothing is changed in the
      // store until the user finishes, so cancelling leaves the book exactly as it was.
      flow = { mode:"add", step:"tier", reId:id, tier:null,
               title:rb.title, author:rb.author, takeaway:rb.takeaway };
      renderFlow();
    };
    document.getElementById("d-save").onclick = ()=>{
      const titleEl = document.getElementById("d-title");
      const t = titleEl.value.trim();
      if(!t){ titleEl.focus(); titleEl.style.borderBottom = "1px solid var(--stamp)"; return; } // title required
      store.books[id].title = t;
      store.books[id].author = document.getElementById("d-author").value.trim();
      store.books[id].takeaway = document.getElementById("d-take").value.trim();
      store.books[id].genres = flow.genres.slice();
      save(); const hl=id; closeModal(); render(hl);
    };
    document.getElementById("d-remove").onclick = ()=>{
      const btn = document.getElementById("d-remove");
      if(btn.dataset.armed){
        const t = b.tier;
        store.rankings[t] = store.rankings[t].filter(x=>x!==id);
        delete store.books[id];
        save(); closeModal(); render();
      }else{
        btn.dataset.armed = "1";
        btn.textContent = "Really remove?";
        btn.classList.add("armed");
      }
    };
  }

  // ---- Backup & restore (export / import) ----
  // The whole catalog is a small JSON object, so a backup is just that object
  // written to a file the user can save and re-load later. No server involved.
  function doExport(){
    const blob = new Blob([JSON.stringify(store, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
    const a = document.createElement("a");
    a.href = url; a.download = "the-stacks-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Check an imported object looks like a real Stacks backup.
  // Basic shape first, then a deeper integrity pass: every id listed in
  // rankings must have a matching entry in books (no "dangling" pointers
  // that would crash the render). Returns {ok, count} or {ok:false, reason}.
  function validateImport(data){
    if(typeof data!=="object" || data===null || Array.isArray(data))
      return { ok:false, reason:'This isn\'t a Stacks backup — it should be one object containing "books" and "rankings".' };
    if(typeof data.books!=="object" || data.books===null || Array.isArray(data.books))
      return { ok:false, reason:'The file is missing a valid "books" section.' };
    if(typeof data.rankings!=="object" || data.rankings===null || Array.isArray(data.rankings))
      return { ok:false, reason:'The file is missing a valid "rankings" section.' };
    for(const t of TIERS){
      if(!Array.isArray(data.rankings[t]))
        return { ok:false, reason:'The "rankings" section is missing the "'+t+'" list.' };
    }
    for(const t of TIERS){
      for(const id of data.rankings[t]){
        if(typeof id!=="string" || !data.books[id])
          return { ok:false, reason:'The file is damaged: a ranked book ("'+id+'") has no matching entry in "books".' };
      }
    }
    const count = TIERS.reduce((a,t)=>a+data.rankings[t].length,0);
    return { ok:true, count };
  }

  const importInput = document.getElementById("importFile");
  document.getElementById("exportBtn").onclick = doExport;
  document.getElementById("importBtn").onclick = ()=> importInput.click();
  document.getElementById("insightsBtn").onclick = openInsights;
  importInput.onchange = ()=>{
    const file = importInput.files && importInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      importInput.value = ""; // reset so re-picking the same file fires change again
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ return showImportError("That file isn't valid JSON, so it can't be a Stacks backup."); }
      const res = validateImport(data);
      if(!res.ok) return showImportError(res.reason);
      confirmImport(data, res.count);
    };
    reader.onerror = ()=>{ importInput.value=""; showImportError("The file couldn't be read. Try exporting a fresh backup and importing that."); };
    reader.readAsText(file);
  };

  function showImportError(msg){
    flow = null;
    sheet.innerHTML =
      '<h2 id="sheetTitle">That didn\'t look like a backup</h2>'+
      '<p class="step-tag">Nothing was changed</p>'+
      '<p class="modal-copy">'+esc(msg)+'</p>'+
      '<p class="modal-copy soft">A backup is the ".json" file this app makes when you choose <b>Export catalog</b>.</p>'+
      '<div class="row"><button class="btn primary" id="ie-ok">OK</button></div>';
    document.getElementById("ie-ok").onclick = closeModal;
    openModal();
    document.getElementById("ie-ok").focus();
  }

  function confirmImport(data, count){
    flow = null;
    const current = totalBooks();
    sheet.innerHTML =
      '<h2 id="sheetTitle">Replace your catalog?</h2>'+
      '<p class="step-tag">This overwrites what\'s in the app now</p>'+
      '<p class="modal-copy">Importing replaces your current catalog of <b>'+current+'</b> '+
        (current===1?'book':'books')+' with <b>'+count+'</b> '+(count===1?'book':'books')+' from the file.</p>'+
      '<p class="modal-copy soft">If you might want your current list back, cancel and export it first.</p>'+
      '<div class="row">'+
        '<button class="btn ghost" id="ic-cancel">Cancel</button>'+
        '<button class="btn primary" id="ic-confirm">Replace catalog</button>'+
      '</div>';
    document.getElementById("ic-cancel").onclick = closeModal;
    document.getElementById("ic-confirm").onclick = ()=>{
      store = migrate(data); save(); closeModal(); render(); // upgrade old backups too
    };
    openModal();
    document.getElementById("ic-cancel").focus();
  }

  // ---- Findability controls wiring ----
  document.getElementById("q").addEventListener("input", e=>{ view.query = e.target.value; render(); });
  document.getElementById("sortSel").addEventListener("change", e=>{ view.sort = e.target.value; render(); });
  document.getElementById("tierChips").addEventListener("click", e=>{
    const chip = e.target.closest(".chip");
    if(!chip) return;
    view.tier = chip.dataset.tier;
    render();
  });

  render();
})();
</script>
</body>
</html>
